<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4MwHd4XBBnV</textarea><textarea class="article-author"> </textarea><textarea class="article-host">yrd.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">江苏南京：“端”上文商旅体大餐 “午”动假期消费热情</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">今年端午假期，南京市一系列传统文化与现代商业相结合的特色促消费活动接连启动，吸引了市民游客参与体验，点燃假日消费热情</textarea><textarea class="article-catnode">/e3pu6i31u/eecc38g1f</textarea><textarea class="article-content"><article><section data-type="rtext"><p>玄武湖、百家湖上龙舟竞渡，商圈、街区霓虹璀璨，南京奥体中心演唱会激情四射，五台山体育中心体育场“苏超”战火再燃……</p><p>潮流涌动、传统出新、活力迸发！今年端午假期，南京围绕节日、夏日时令特点，组织开展了形式多样的消费促进和文商旅体活动，消费和文旅市场活力进一步激发。端午假期，全市接待游客568万人次，按可比口径较去年同期上升3.5%。银联商务数据显示，南京市游客文旅消费总额31.3亿元，其中，外地游客文旅消费总额17.6亿元，同比增长5.6%，全省占比25.9%，位列第一。市商务局重点监测的100余家商贸流通企业共实现销售（营业）额14.23亿元，同比增长8.67%。</p><p><em data-scene="strong">特色活动轮番上演，重点商场销售额增长超两成</em></p><p>6月2日，金陵STYLE浪漫中心新摆出的为期3天的主题市集，吸引了很多市民游客。大家在市集上品尝米其林美食、感受房车露营、逛闲鱼循环商店、体验特色运动项目，很是热闹。市集上，看到红山森林动物园的网红动物模型，小朋友们兴奋地让家长帮他们拍照。“现场吃的、玩的都有，孩子非常开心。”市民朱女士说。</p><p>今年端午假期，南京市一系列传统文化与现代商业相结合的特色促消费活动接连启动，吸引了市民游客参与体验，点燃假日消费热情。</p><p>假期首日，“四季有约·仲夏不眠夜”系列活动在百家湖商圈启动，并同步举办第二十二届南京市外商投资企业龙舟邀请赛，掀起假期消费热潮。秦淮区启动“风雅秦淮 悦购仲夏”2025年秦淮商旅文融合消费系列活动，并推出商旅文融合“秦淮GO（购）”消费权益包；鼓楼区开启“鼓楼艺潮·青春共振”计划暨“乐购一夏”消费促进活动，携手抖音生活服务平台，发放100万元“品质消费来鼓楼”惠民消费券；溧水区以“夏遇端午 美好焕新”为主题，围绕以旧换新、农特产品、首发经济、夜间经济等开展促消费活动，组织重点企业发放消费券……</p><p>一场场潮流活动、一幕幕创新场景，在南京的大街小巷展开，成为拉动消费的重要引擎。数据显示，假期3天，全市重点监测的商场、综合体合计实现销售额5.34亿元，同比增长22.54%。新街口商圈重点监测的百货类企业合计实现销售额3.66亿元，同比增长28.26%。</p><p><em data-scene="strong">传统民俗文化“飘香”，圈粉市民游客</em></p><p>这个端午假期，南京推出多彩的民俗风味“文旅大餐”。仅端午节当天，玄武湖景区、金牛湖景区、溧水区、江宁区等地共举办龙舟比赛和体验活动6场，大批游客在岸边呐喊助威，看龙舟健儿劈波斩浪，有的干脆亲自上阵挥桨，沉浸式感受浓厚节日氛围。</p><p>端午节与儿童节合璧，民俗和童趣碰撞出不一样的新玩法。熙南里街区推出以“民俗体验+亲子互动”为特色的系列活动，3天共迎客12.4万人次。家长带着孩子包粽子、射五毒、画鸭蛋，用指尖感受传统民俗的深厚底蕴，在非遗市集上选购端午限定文创，观摩剪纸、草编、绳结等非遗代表性项目现场展示……</p><p>南京智慧旅游大数据运行监测平台显示，端午假期，南京景区景点游客量达223万人次，文博场馆游客量达23.5万人次，乡村旅游点游客量达42.9万人次。外地游客依然是“主力军”，占比64.8%，较去年同期上升0.8个百分点。省外客源地排名前十的地区分别是安徽、浙江、上海、山东、河南、广东、北京、湖北、江西、河北。景区游客量接待Top5分别为夫子庙—秦淮风光带、钟山风景名胜区—中山陵园风景区、玄武湖景区、南京博物院、红山森林动物园。</p><p>多彩的民俗活动不仅吸引国内游客，也让老外“上头”。2025第二十二届南京市外商投资企业龙舟邀请赛，17支外商投资企业龙舟队在百家湖上演速度与激情，现场设置的多家老字号市集也让他们流连忘返。来自德国的普伟哲首次参加龙舟赛，他说，第一次接触就对龙舟产生了浓厚的兴趣，“我知道端午节要赛龙舟和吃粽子，中国的传统文化非常有趣。”</p><p><em data-scene="strong">跟着演出（赛事）游南京，释放经济新活力</em></p><p>“为一场演出（赛事），赴一座城”的消费新模式，在端午假期全面引爆。端午期间，全市营业性演出共有95场，其中大型演出4场。5月31日、6月1日周深南京奥体演唱会，2场售票超9万张；6月1日、2日汤山音乐谷风暴电音节，2场售票1.9万张。6月1日“苏超”南京队VS无锡队在五台山体育馆对战，吸引15669名球迷到场助阵。</p><p>文艺展演、体育赛事等服务消费业态与实物商业消费在端午假期进一步协同共促，充分满足消费者当下的新型消费需求。为了让五湖四海前来观演、观赛的观众拥有更好的逛吃体验，相关部门、企业联合发出“观演大礼包”——跟着演出（赛事）游南京乐享“1+3”优惠活动。南京黄埔大酒店为手持演唱会票根前来的周深粉丝推出客房两晚连住优惠套餐，免费供应夜宵，发放“歌迷能量应援包”；为手持“苏超”票根前来的球迷推出免费领取盐水鸭的福利，5月31日晚客房基本全满，6月1日晚客房出租率也高达近九成。受周深演唱会、“苏超”联赛及风暴电音节等活动辐射，南京奥体中心、五台山体育中心、江宁汤山周边区域的酒店表现突出，如南京华泰万丽酒店、南京紫峰洲际酒店、南京威斯汀温泉度假酒店等连续2日满房。越来越多游客在宁住下来，端午假期前两天，南京星级饭店和部分品牌酒店平均入住率达82%，42家酒店连续满房。</p><p>“下乡”感受田园生活美好，也是很多市民游客端午假期的新选择。假期首日，乡村旅游接待量突破20.2万人次，较去年同期上升37%，创历史同期新高。高峰期超40家特色民宿满房，其中浦口区黎家营和江宁区龙尚村的入住率分别超90%和74%。</p><p>在各大旅游电商平台上，南京频频上榜全国“Top10”。美团旅行发布的2025“端午”十大文旅热门城市中，南京位于榜首。携程发布的《2025年端午旅游报告》显示，端午假期，南京位列周边游热门目的地Top2、国内热门旅游目的地Top4。途牛发布的《2025端午出游消费盘点》显示，南京位列高铁游热门目的地Top4、境内游热门目的地Top5、自驾游热门目的地Top5、亲子游热门目的地Top6，“南京3日游”位列跟团游热门产品销售亚军。去哪儿旅行《2025端午出游总结报告》显示，南京市位列“端午假期酒店预订Top10”。据美团、途牛、去哪儿旅行等多家OTA平台数据显示，南京文旅消费总额均居全省首位。南京日报/紫金山新闻记者 黄琳燕 李子俊</p></section></article></textarea><textarea class="article-time">1748914327981</textarea><textarea class="art
