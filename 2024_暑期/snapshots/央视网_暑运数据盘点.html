<!DOCTYPE html><html><head><meta charset='utf-8'><title>8.87亿、1600万、6.2% '数'说2024年暑运旺盛活力</title></head><body><h1>8.87亿、1600万、6.2% '数'说2024年暑运旺盛活力</h1><p>8月31日，为期62天的铁路暑运结束。全国铁路累计发送旅客8.87亿人次，创历史同期新高。数据显示，7月1日至8月31日，全国铁路累计发送旅客8.87亿人次，同比增长6.7%，日均发送旅客1431.2万人次，其中8月10日至12日连续3天单日客流超1600万人次。</p></body></html>
