<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4Gdpc5vcvcy</textarea><textarea class="article-author"> </textarea><textarea class="article-host">china.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">2024年春节假期全国国内旅游出游4.74亿人次 同比增长34.3%</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">2024年春节假期全国国内旅游出游4.74亿人次 同比增长34.3%</textarea><textarea class="article-catnode">/e3pmh1nnq/e7tl4e309</textarea><textarea class="article-content"><article><section data-type="rtext"><p>人民网北京2月18日电 （记者杨虞波罗）据文化和旅游部消息，2024年春节期间，文化和旅游市场平稳有序。据初步统计，全国举办“村晚”、戏曲进乡村、新年画活动、图书馆里过大年等群众文化活动约15万场，线上线下约6.69亿人次参与。春节假期全国营业性演出场次1.63万场，同比增长52.10%；票房收入7.78亿元，同比增长80.09%；观演人数657.65万人次，同比增长77.71%。</p><p>经文化和旅游部数据中心测算，春节假期8天全国国内旅游出游4.74亿人次，同比增长34.3%，按可比口径较2019年同期增长19.0%；国内游客出游总花费6326.87亿元，同比增长47.3%，按可比口径较2019年同期增长7.7%；入出境旅游约683万人次，其中出境游约360万人次，入境游约323万人次。</p><p>春节期间，各类文艺演出和公共文化活动广泛开展，为广大群众送上丰富多彩的新春年礼。特色非遗传统民俗扮靓节日氛围。天津、山东、湖南、贵州非遗大集买年货，安徽“皖美过大年”等文化惠民活动火热开展，透出浓浓文化气息。新春灯会、舞龙表演、庙会市集、非遗秀场等活动成为游客新春出游的重要选择。热门博物馆持续火爆。北京故宫博物院、国家博物馆、四川三星堆博物馆等客流保持高位，多地文博场馆围绕龙年主题开展“博物馆里阖家游”“春节游览学知识”等特色活动，呈现“大有大的热闹、小有小的品质”的格局。各类演出活动精彩纷呈。</p><p>“南北互换、东西互跨”特征显著。春运开始以来北方居民纷纷南下，南方居民到北方滑雪、赏冰成为新时尚。广东、四川、广西、湖南、贵州等南方目的地热度高；黑龙江、吉林、新疆、辽宁、内蒙古等地依托丰富的冰雪资源举办冰雪旅游节等活动，丰富冰雪旅游消费新方式，释放假日旅游消费新动能。红色旅游成春节出游新亮点。中共一大纪念馆景区、西柏坡纪念馆景区、江苏周恩来故居、福建古田旅游区等景区人头攒动，热闹非凡。湖南橘子洲旅游区春节期间接待游客63.2万人次，同比增长44.63%。</p><p>富有历史底蕴景区和极具人文特色古城备受欢迎。天津古文化街、新疆喀什古城、湖南凤凰古城、云南和顺古镇、河北正定古城等吸引广大游客前来过大年。河南洛阳举办神都灯宴等29项“穿越盛唐洛阳年”主题活动，开封清明上河园让游客沉浸式体验传统文化。在互免签证、通关便利和航线恢复等利好政策推动下，入出境旅游加速恢复发展。出境方面以赴中国港澳地区以及日韩、东南亚、东北亚等国家和地区的短途跨境游为主，部分旅行社“新马泰”产品基本恢复到2019年同期水平。</p><p>国家级夜间文化和旅游消费集聚区人气旺、消费热、暖意浓，春节期间，已纳入监测范围的集聚区累计夜间客流量9851.21万人次，同比增长58.31%。重庆解放碑、西安大唐不夜城、广州北京路街区、哈尔滨中央大街等集聚区进入全国客流量前十商圈。</p><p>山东、江苏、重庆、云南、广西等地持续开展2024年春节文化和旅游消费月、“旅游迎春 休闲过年”等活动。内蒙古以举办第十四届全国冬季运动会为契机，推出七大类1500项特色文化和旅游活动。海南精心策划举办民俗非遗、“村晚”等活动超320场，环岛旅游公路周边民宿、房车营地迎来客流高峰。产品服务持续提质升级。黑龙江采取多重暖心服务保障，及时回应游客关切。多地以人工智能技术为支撑，实现对城市、重点景区及商圈的热度预报，配合客流疏导，提升旅游高峰期管理效率和游客体验。</p></section></article></textarea><textarea class="article-time">1708263339383</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：任鑫恚</textarea><textarea class="article-source-name"><a href="http://ent.people.com.cn/n1/2024/0218/c1012-40178724.html" >人民网</a></textarea><textarea class="article-ext-xtime">1708263339383</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover"></textarea><textarea class="article-keyboarder">{"email":"renxinhui@huanqiu.com","name":"任鑫恚"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><script>function decodeEntities(encodedString) {
