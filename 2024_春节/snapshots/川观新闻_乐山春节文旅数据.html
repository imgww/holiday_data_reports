<!DOCTYPE html><html><head><meta charset='utf-8'><title>乐山8天吸客超247万人次</title></head><body><h1>乐山8天吸客超247万人次 迎来史上最热春节档</h1><p>全市开放的39家A级旅游景区接待游客247.46万人次，实现门票收入5894.85万元，同比分别增长37.40%、41.85%。</p><p>峨眉山景区接待游客40.03万人次，实现门票收入3085.13万元，同比分别增长44.03%、54.05%。</p><p>乐山大佛景区接待游客59.50万人次，实现门票收入1988.54万元，同比分别增长18.47%、30.69%。</p></body></html>
