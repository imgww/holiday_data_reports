<script>
  var url_params = getUrlParams()
  getSpecialCategory()

  var menuTitleColor = '' // 顶部菜单，标题的颜色
  var listRandarType = '' // 栏目渲染样式类型
  var loadImageErrSrc = ['/web_code/static/image/default_show.png', '/web_code/static/image/error_show.png'];
  var extraInfo = null;
  // 获取专题分类
  function getSpecialCategory() {
    var submitParams = {
      id: url_params.specialId || $config.specialFourId, // 如果url上有值，优先取url上的值
      code: '',
      status: '',
      name: '',
      appId: '71',
      strAppIds: '',
      page: 0,
      size: 20,
      sort: 'id,asc'
    }
    $.ajax({
      type: "get",
      url: $config.APIBaseUrl + "subject/getCategory/" + submitParams.id,
      contentType: 'application/json',
      dataType: "json",
      success: function (data) {
        if (data.businessCode === "00000") {
          console.log('所有专题', data)
          var headerBg = document.getElementById('header-bg')
          var subjectData = data.resultSet[0]
          headerBg.src = getImageUrl(subjectData.images, 'bg')
          document.getElementById('category-menu-box').style.background = "url("+getImageUrl(subjectData.images, 'material-h')+") no-repeat top"
          dealConfigInfo(subjectData);
          document.getElementsByTagName('title')[0].innerText = subjectData.name + '_海南网络广播电视台'
          randerCategoryMenu(subjectData.childCategories)
          getListBycategory(subjectData.childCategories)
        } else {
          console.log(data.resultSet)
        }
      },
      error: function (err) {
        console.log(err)
      }
    })
  }

  // 处理专题配置
  function dealConfigInfo (subjectData) {
    // 如果有竖线 | , 则取竖线之前的值作为菜单标题的颜色
    if (subjectData.description) {
      if (subjectData.description.indexOf('|') > -1) {
        menuTitleColor = subjectData.description.split('|')[0]
        subjectData.description = subjectData.description.split('|')[1]
      }
      listRandarType = subjectData.description.split(',')
    } else {
      listRandarType = []
    }
    if (subjectData.extraInfo) {
      try {
        extraInfo = JSON.parse(subjectData.extraInfo);
        if (extraInfo.titleColor) {
          menuTitleColor = extraInfo.titleColor;
        }
        if (extraInfo.subjectBg) {
          document.getElementById('special-list').style.background = extraInfo.subjectBg;
        }
        if (extraInfo.categoryInfo) {
          var list = subjectData.childCategories;
          var typeList = extraInfo.categoryInfo;
          for (var i = 0; i < list.length; i++) {
            if (list[i].code === typeList[i].categoryCode) {
              listRandarType[i] = typeList[i].style || listRandarType[i];
            } else {
              for (var j = 0; j < typeList.length; j++) {
                if (list[i].code === typeList[j].categoryCode) {
                  listRandarType[i] = typeList[j].style || listRandarType[i];
                }
              }
            }
          }
        }
        console.log('专题配置项', extraInfo)
      } catch(err) {
        console.log('报错了' + err)
      }
    }
  }

  function dealATitleColor (categoryIndex) {
    console.log('===>', categoryIndex)
    var parentList = document.getElementById('special-list').children;
    var itemConfig = getCategoryConfig(categoryIndex);
    var color = itemConfig ? itemConfig.titleColor : '';
    if (color) {
      var aList = parentList[categoryIndex].getElementsByTagName('a');
      var pList = parentList[categoryIndex].getElementsByTagName('p');
      for (var i = 0; i < aList.length; i++) {
        aList[i].style.cssText += 'color: ' + color + ' !important;';
      }
      for (var i = 0; i < pList.length; i++) {
        pList[i].style.cssText += 'color: ' + color + ' !important;';
      }
    }
  }

  var categoryListFour = {} // 存放二级目录标题及url
  // 根据不同id获取
  function getListBycategory(list) {
    var specialList = document.getElementById('special-list')
    var specialListStr = ''
    for (var i=0; i<list.length; i++) {
      var array = list[i].code.split('_')
      var fileName = array[array.length - 1]
      var itemNumber = Number(listRandarType[i])
      if (!itemNumber || itemNumber > 12) {
        continue
      }
      var nodeStr = document.getElementById('item_' + itemNumber).innerHTML
      if (itemNumber === 4 || itemNumber === 7) {
        nodeStr = nodeStr.replace('$$href$$', 'javascript:void(0)').replace('target="_blank"', '')
      }
      switch(itemNumber) {
        case 1:
          specialListStr += nodeStr.replace('$$bannerId$$', 'article-banner-' + i)
                                   .replace('$$hrefId$$', 'zxzx-' + i)
                                   .replace('$$listId$$', 'content-list-' + i)
          break
        case 2:
        case 3:
        case 4:
        case 5:
        case 6:
        case 7:
        case 8:
        case 9:
        case 11:
          var imgSrc = getImageUrl(list[i].images, 'material-h');
          
          specialListStr += nodeStr.replace('$$href$$', $config.baseUrl + '/info/' + fileName + '.html')
                                   .replace('$$src$$', imgSrc)
                                   .replace('$$style$$', loadImageErrSrc.some(function (item) {return item.indexOf(imgSrc) > -1}) ? 'width: auto;' : 'width: 100% !important;')
                                   .replace('$$title$$', list[i].name)
                                   .replace('$$id$$', 'item-list-' + i)
          break
        case 10:
          specialListStr += nodeStr.replace('$$headlineId$$', 'item-list-' + i);
          break
        case 12:
          var imgSrc = getImageUrl(list[i].images, 'material-h');
          specialListStr += nodeStr.replace('$$bannerId$$', 'article-banner-' + i)
                                   .replace('$$href$$', $config.baseUrl + '/info/' + fileName + '.html')
                                   .replace('$$src$$', imgSrc)
                                   .replace('$$style$$', loadImageErrSrc.some(function (item) {return item.indexOf(imgSrc) > -1}) ? 'width: auto;' : 'width: 100% !important;')
                                   .replace('$$title$$', list[i].name)
                                   .replace('$$id$$', 'item-list-' + i)
          break
        default:
          console.log('没有这个选项')
      }
    }
    specialList.innerHTML = specialListStr
    for (var i=0; i<list.length; i++) {
      var array = list[i].code.split('_')
      var fileName = array[array.length - 1]
      var itemNumber = Number(listRandarType[i])
      if (!itemNumber) {
        continue
      }
      var itemConfig = getCategoryConfig(i);
      var maxShowLength = itemConfig && itemConfig.showLength ? itemConfig.showLength : 0;
      switch(itemNumber) {
        case 1:
          getSpecialCategoryBanner(list[i].id, ('article-banner-' + i), ('content-list-' + i), (maxShowLength ? maxShowLength : 5), i);
          // getSpecialCategoryList(list[i].id, 'content-list-' + i, i);
          document.getElementById('zxzx-' + i).href = $config.baseUrl + '/info/'+fileName+'.html';
          document.getElementById('zxzx-' + i).innerHTML = '<img src="'+getImageUrl(list[i].images, 'material-h')+'" alt="'+list[i].name+'">';
          break
        case 2:
          getSpecialCategoryItemListTwo(list[i].id, 'item-list-' + i, (maxShowLength || 19), i);
          break
        case 3:
          getSpecialCategoryItemList(list[i].id, 'item-list-' + i, 8, i);
          break
        case 4:
          if (list[i].children) {
            var categoryListStr = ''
            var totalLength = list[i].children.length
            categoryListStr += '<div class="category-menu-list">'
            list[i].children.forEach(function (item, index) {
              array = item.code.split('_')
              fileName = array[array.length - 1]
              categoryListStr += '<div class="category-menu-item" id="category-menu-item-'+index+'" style="width: '+(100/totalLength)+'%;background-image: url('+getImageUrl(item.images, 'material-h')+')" ><a href="'+$config.baseUrl + '/info/'+fileName+'.html" target="_blank"></a></div>'
            })
            categoryListStr += '</div>'
            categoryListStr += '<div class="category-content-list">'
            list[i].children.forEach(function (item, index) {
              categoryListStr += '<div class="category-content-item" id="category-content-item-'+index+'"></div>'
            })
            categoryListStr += '</div>'

            document.getElementById('item-list-' + i).innerHTML = categoryListStr

            document.getElementById('category-menu-item-0').classList.add('category-menu-current')
            categoryListFour[i] = []
            list[i].children.forEach(function(item, index) {
              array = item.code.split('_')
              fileName = array[array.length - 1]
              categoryListFour[i].push({
                name: item.name,
                url: $config.baseUrl + '/info/'+fileName+'.html'
              })
              getSpecialCategoryItemListFour(item.id, i, index, i);
            })
          }
          break
        case 5:
          getSpecialCategoryItemList(list[i].id, 'item-list-' + i, '', i);
          break
        case 6:
          getSpecialCategoryItemList(list[i].id, 'item-list-' + i, 8, i);
          break
        case 7:
          if (list[i].children) {
            var categoryListStr = ''
            var totalLength = list[i].children.length
            var itemMenuId = []
            categoryListStr += '<div class="seven-block">'
            list[i].children.forEach(function (item, index) {
              array = item.code.split('_')
              fileName = array[array.length - 1]
              categoryList.push({
                name: item.name,
                url: $config.baseUrl + '/info/'+fileName+'.html'
              })
              var id = 'seven-block-' + (categoryList.length - 1) + '-list-'+index
              var sevenBlockItemList = '<div class="seven-block-item-list" id="' + id + '"></div>'
              itemMenuId.push(id)
              categoryListStr += '<div class="seven-block-item" id="seven-block-item-'+index+'"><a href="'+$config.baseUrl + '/info/'+fileName+'.html" target="_blank"><img src="' + getImageUrl(item.images, 'material-h') + '" ></a>' + sevenBlockItemList + '</div>'
            })
            categoryListStr += '</div>'
            document.getElementById('item-list-' + i).innerHTML = categoryListStr
            list[i].children.forEach(function(item, index) {
              getSpecialCategoryItemList(item.id, itemMenuId[index], 4, i);
            })
          }
          break
        case 8:
          getSpecialCategoryItemList(list[i].id, 'item-list-' + i, 6, i);
          break
        case 9:
          getSpecialCategoryItemList(list[i].id, 'item-list-' + i, 3, i);
          break
        case 10:
          getHeadlinesList(list[i].id, 'item-list-' + i, i);
          break
        case 11:
          getElevenList(list[i].id, 'item-list-' + i, i);
          break
        case 12:
          getSpecialBannerList(list[i].id, ('article-banner-' + i), ( 'item-list-' + i), (maxShowLength ? maxShowLength : 5), i);
          break
        default:
          console.log('不处理')
      }
    }
  }

  // 获取头条样式的配置数据
  function getHeadlinesList (id, nodeId, categoryIndex) {
    $.ajax({
      type: "get",
      url: $config.APIBaseUrl + "contentCategory/list?categoryId=" + id,
      contentType: 'application/json',
      dataType: "json",
      success: function (data) {
        if (data.businessCode === "00000") {
          console.log('专题banner', data);
          randerHeadlinesList(data.resultSet[0].content, nodeId, categoryIndex);
          dealATitleColor(categoryIndex);
        } else {
          console.log(data.resultSet)
        }
      },
      error: function (err) {
        console.log(err)
      }
    })
  }
  // 获取获取第11个样式数据
  function getElevenList (id, nodeId, categoryIndex) {
    $.ajax({
      type: "get",
      url: $config.APIBaseUrl + "contentCategory/list?categoryId=" + id,
      contentType: 'application/json',
      dataType: "json",
      success: function (data) {
        if (data.businessCode === "00000") {
          console.log('专题banner', data);
          randerElevenList(data.resultSet[0].content, nodeId);
          dealATitleColor(categoryIndex);
        } else {
          console.log(data.resultSet)
        }
      },
      error: function (err) {
        console.log(err)
      }
    })

  // 渲染banner
  function CreateBannerObject(bannerObj) {
    if (!bannerObj || bannerObj.id === undefined) {
      return ''
    }
    this.bannerElem = document.getElementById(bannerObj.id)
    this.bannerUlElem = this.bannerElem.getElementsByTagName('ul')
    this.bannerItemElem = this.bannerElem.getElementsByTagName('li')
    this.currentIndex = 0 //  当前显示第几个
    this.bannerSetTimeout = null //  自动切换
    this.canClickMove = true //  是否可点击切换移动
    this.canClickMoveTimeOut = true //  是否可点击切换的移动延时切换事件
    this.bannerIndexElem = createElementFunc({
      elem: 'div',
      class: 'banner-index',
      style: {
        position: 'absolute',
        bottom: '0',
        right: '20px',
        zIndex: '2'
      }
    })
    console.log(this.bannerUlElem)
    console.log(this.bannerItemElem)
    if (!this.bannerUlElem || this.bannerUlElem.length < 0 || !this.bannerItemElem || this.bannerItemElem.length < 0) {
      return ''
    }
    var bannerLength = this.bannerItemElem.length
    var that = this
    this.bannerElem.appendChild(this.bannerIndexElem)
    this.bannerUlElem[0].style.transform = 'translateX(0)'
    var leftClickMove = createElementFunc({
      elem: 'div',
      style: {
        position: 'absolute',
        width: '40px',
        height: '80px',
        top: '50%',
        marginTop: '-40px',
        zIndex: 12,
        color: '#999',
        cursor: 'pointer',
        display: 'block',
        left: '0',
        transition: 'left .3s'
      },
      event: {
        onclick: function () {
          console.log('左')
          that.bannerClickMove(-1)
        }
      }
    })
    var rightClickMove = createElementFunc({
      elem: 'div',
      style: {
        position: 'absolute',
        width: '40px',
        height: '80px',
        top: '50%',
        marginTop: '-40px',
        zIndex: 12,
        color: '#999',
        cursor: 'pointer',
        display: 'block',
        right: '0',
        transition: 'right .3s'
      },
      event: {
        onclick: function () {
          console.log('右')
          that.bannerClickMove(0)
        }
      }
    })
    leftClickMove.appendChild(createElementFunc({
      elem: 'img',
      style: {
        display: 'block',
        width: '100%',
        height: '100%'
      },
      attributes: {
        src: $config.baseUrl + '/web_code/static/image/leftImage.png'
      }
    }))
    rightClickMove.appendChild(createElementFunc({
      elem: 'img',
      style: {
        display: 'block',
        width: '100%',
        height: '100%'
      },
      attributes: {
        src: $config.baseUrl + '/web_code/static/image/rightImage.png'
      }
    }))
    this.bannerElem.appendChild(leftClickMove)
    this.bannerElem.appendChild(rightClickMove)
    console.log('创建完毕')
    console.log(this.bannerElem)
    this.bannerElem.appendChild(this.bannerIndexElem)

    var indexSpan = createElementFunc({
      elem: 'p',
      class: 'banner-index'
    })
    this.bannerIndexElem.appendChild(indexSpan)
    console.log(indexSpan)
    indexSpan.appendChild(createElementFunc({
      elem: 'span',
      text: '1'
    }))
    indexSpan.appendChild(createElementFunc({
      elem: 'span',
      text: '/'
    }))
    indexSpan.appendChild(createElementFunc({
      elem: 'span',
      text: bannerLength + ''
    }))
    for (var i = 0; i < bannerLength; i++) {
        this.bannerItemElem[i].style.left = (i * 100) + '%'
    }

    this.currentItem = function (e) { //  切换
      console.log(e)
      this.currentIndex = e.target.index - 1
      if (this.currentIndex < 0) {
        this.currentIndex = this.bannerItemElem.length - 1
      }
      console.log(this.currentIndex)
      this.bannerItemSetCurrent()
    }
    if (!bannerObj.hasOwnProperty('enterStop') || bannerObj.enterStop) {
      this.bannerElem.addEventListener('mouseenter', function () {
        console.log('鼠标进来了')
        clearSetTimeOut(that.bannerSetTimeout)
      })
      this.bannerElem.addEventListener('mouseleave', function () {
        console.log('鼠标出去了')
        that.bannerMove()
      })
    }
    this.bannerItemSetCurrent = function () {
      this.currentIndex++
      if (this.currentIndex > bannerLength - 1) {
        this.currentIndex = 0
      }
      for (var i = 0; i < bannerLength; i++) {
        this.bannerItemElem[i].style.transform = 'translateX(-' + (this.currentIndex * 100) + '%)'
      }
      var bannerIndexSpan = this.bannerIndexElem.getElementsByTagName('span')
      bannerIndexSpan[0].textContent = this.currentIndex + 1
    }

    this.bannerMove = function () {
      this.canClickMove = true
      clearSetTimeOut(this.canClickMoveTimeOut)
      clearSetTimeOut(this.bannerSetTimeout)
      this.bannerSetTimeout = setTimeout(function () {
        that.bannerItemSetCurrent()
        that.bannerMove()
      }, 5000)
    }

    this.bannerClickMove = function (value) {
      if (this.canClickMove) {
        this.canClickMove = false
        this.currentIndex += value
        if (this.currentIndex >= 0 && value < 0) {
          this.currentIndex--
        } else if (this.currentIndex < 0) {
          this.currentIndex = this.bannerItemElem.length - 2
        }
        if (this.currentIndex > this.bannerItemElem.length - 1) {
          this.currentIndex = 0
        }
        console.log(this.currentIndex)
        this.bannerItemSetCurrent()
        this.canClickMoveTimeOut = setTimeout(function () {
          that.canClickMove = true
        }, 300)
      }
    }
    this.bannerMove()
  }

      contentListStr += '<a href="' + item.link + '" target="_blank" title="' + item.title + '"><div class="right-list-item">' + item.title + '</div></a>'
      contentListStr += i < list.length - 1 ? '' : '</div>'
    }
  }
  contentList.innerHTML = contentListStr
  document.getElementById('category-menu-item-' + id).onmouseenter = function () {
    var categoryMenuItem = document.getElementsByClassName('category-menu-item')
    for (var i=0; i<categoryMenuItem.length; i++) {

    document.getElementById('category-menu-item-' + id).classList.add('category-menu-current')
    document.getElementById('category-content-item-' + id).style.display = 'flex'
  }
}
