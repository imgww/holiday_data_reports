	displayContent = function(content) {

						.substring(0, 4)

						+ content[0]['publishTime'].substring(4, 6)
						+ "-"
						+ content[0]['publishTime'].substring(6, 8) : '&nbsp;'); // 发布时间
		$('#ztfl').html(content[0]['ztfl'] ? content[0]['ztfl'] : '&nbsp;'); //主题分类
		$('#mc').html(content[0]['mc'] ? content[0]['mc'] : '&nbsp;'); //标题
		$('#gjc').html(content[0]['gjc'] ? content[0]['gjc'] : '&nbsp;'); // 关键词
		$('#fwzh').html(content[0]['wh'] ? content[0]['wh'] : '&nbsp;'); //发字文号
		$('#fzrq').html(content[0]['fzrq'] ? content[0]['fzrq'] : '&nbsp;'); //废止时间 
		$('#fwdw').html(content[0]['fwdw'] ? content[0]['fwdw'] : '&nbsp;');
		$('#zwsj').html(formatTime(content[0]['publishTime'])); //正文时间
		$('#cwrq').html(content[0]['scrq'] ? content[0]['scrq'] : '&nbsp;'); // 成文日期
		var htmlContent = content[0]['htmlContent'] ? content[0]['htmlContent']
				: '&nbsp;';
		htmlContent = initHtml(htmlContent);
		document.title = content[0]['title'];
		$('#htmlContent').html(htmlContent);
		$("#htmlContent p").css({
			'font-Size' : '16pt',
			'line-height' : '30pt'
		});
	}

	function initHtml(htmlContent) {
		var td = $("<td></td>");

		var re = /<!--([^a]|a)*?-->/gi;
		htmlContent = htmlContent.replace(re, "");
		re = /<br\s*\/?>\s*/gi;
		htmlContent = htmlContent.replace(re, "<br>");

		re = /<br>/gi;
		htmlContent = htmlContent.replace(re, "</p><p>");
		re = /(\s|&nbsp\;)+<\/p>/gi;
		htmlContent = htmlContent.replace(re, "</p>");
		re = /(\s|&nbsp\;)+<br>/gi;
		htmlContent = htmlContent.replace(re, "<br>");
		re = /<p(\s[^>]*)?>(&nbsp\;|\s)*<\/p>/gi;
		htmlContent = htmlContent.replace(re, "");
		re = /(<br>)+/gi;
		htmlContent = htmlContent.replace(re, "<br>");
		td.html(htmlContent);
		td.find('p,div').each(function(i) {
			var obj = $(this);
			obj.css("line-height", '2');
		});
		return td.html();
	}

	function getSearchOrderByParams() {
		var params = new Array();
		var param = {};
		param.orderBy = 'orderTime';
		param.reverse = true;
		params.push(param);
		return params;
	}

	function changeFontSize(fontSize) {
		var htmlContent = $('#htmlContent').html();
		if (!htmlContent)
			return false;
		var td = $("<td></td>");
		td.html(htmlContent);
		td.find('p,div,td,th,span,font,ul,li,a').each(function(i) {
			var obj = $(this);
			obj.css("font-size", fontSize + 'px');
		});

		$('#htmlContent').css("font-size", fontSize + 'px');
		$('#htmlContent').html(td.html());
	}
</script>
