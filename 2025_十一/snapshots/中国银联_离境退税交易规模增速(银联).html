<script id="tmpl-hot-news" type="text/x-jquery-tmpl">

</script>

<style>
    /*分页样式*/
    .page {
        padding: 0;
    }

    .page-bg {
        text-align: center;
        margin:40px 0 0 0;
    }

    .page-bg .page-tit {
        display: inline-block;
        *zoom: 1;
        *display: inline;
        width: auto;
        line-height: 32px;
        padding-right: 5px;
    }

    .page-bg .page-img {
        width: 16px;
        height: 16px;
        display: inline-block;
        *zoom: 1;
        *display: inline;
        background: url(../../../cn/resources/images/page/page_new_bg.png) no-repeat;
        background-position: 0 0;
        vertical-align: sub;
        *vertical-align: middle;
    }

    .page-bg .page-img.prev {
        margin: 3px 0 0;
        background-position: -48px 0;
    }

    .page-bg .page-img.next {
        margin: 0 0 0 3px;
    }

    .page-bg a {
        display: inline-block;
        line-height: 30px;
        margin-left: 10px;
        min-width: 30px;
        border-radius: 4px;
        text-align: center;
        background: #F6F6F6;
        font-size: 16px;
        color: #222222;
        letter-spacing: 0.5px;
    }

    .page-bg a.step-f {
        width: 64px;
        height: 30px;
    }

    .page-bg a.step-hover,
    .page-bg .step-a:hover,
    .page-bg a.step-f.on:hover {
        background: #DD2C34;
        color: #fff;
    }

    .page-bg .step-a:active,
    .page-bg a.step-f.on:active {
        background: #DD2C34;
        border: 1px solid #DD2C34;
        color: #fff;
    }

    .page-bg a.step-f.on:hover .page-img.prev {
        background-position: -80px 0;
    }

    .page-bg a.step-f.on:hover .page-img.next {
        background-position: -32px 0;
    }

    .page-bg .invaild {
        color: #d5d5d5;
    }

    .page-bg .invaild .page-img.prev {
        background-position: -64px 0;
    }

    .page-bg .invaild .page-img.next {
        background-position: -16px 0;
    }

    .page-bg .page-go {
        display: inline-block;
        *zoom: 1;
        *display: inline;
        width: auto;
        line-height: 32px;
        margin-left: 15px;
    }

    .page-bg .page-go input {
        width: 48px;
        height: 32px;
        line-height: 32px;
        margin: 0 8px;
        background: #FFFFFF;
        border: 1px solid #D9D9D9;
        border-radius: 4px;
        text-align: center;
        padding:0;
        *vertical-align:middle;
    }
    .page-bg .device-pc{display: inline-block;}
    .page-bg .position-control-a{display: inline-block;}
    .page-bg .position-control-b{display: inline-block;}
    .page-bg .page-go input:hover, .page-bg .page-go input:focus {border: 1px solid #4C80FF;}
    .page-bg .page-go input:active {border: 1px solid #4C80FF;}
    .page-bg .device-mobile{display: none;}
    @media (max-width: 760px){
        .page-bg {margin:30px 0 0 0;}
        .page-bg .device-pc{display:none;}
        .page-bg a.step-f {width: 100px;height: 30px;}
        .page-bg a {margin:0;line-height: 30px;text-align: center;background: #FFFFFF;font-size: 13px;color: #DD2C34;letter-spacing: 1px;border: 1px solid #DD2C34;border-radius: 16px}
        .page-bg .invaild { background-color: #ffffff;color: #222222;border: 1px solid #e5e5e5;}
        .page-bg .position-control-a{float:left;}
        .page-bg .position-control-b{float:right;}
        .page-bg .position-control-c{display: inline-block;width: 100px;margin: 0 auto;}
    }
</style>
<script id="tmpl-page-style-1" type="x-jquery-tmpl">
{{if pageModel.pageNo > 0}}
    <div class="page" style="text-decoration: none;" id="pageBlock">
        <div class="page-bg">
            <div class="device-pc">
            <a href="{{= pageModel.url + 'page=1'}}" class="step-f on o-65 ">首页</a>
            </div>
            <div class="position-control-a device-pc">
                {{if pageModel.page>1}}
                    <a href="{{= pageModel.url + 'page='+ pageModel.lastNo}}" class="step-f on o-65">
                        上一页</a>
                {{else}}
                    <a href="javascript:void(0);" class="step-f invaild o-25">
                        上一页</a>
                {{/if}}
             </div>
             <div class="device-pc">
                {{each(i,noPage) pageNumList}}
                    <a href="{{= pageModel.url + 'page='+noPage.num}}"
                        {{if pageModel.page == noPage.num}}
                            class="step-a step-hover o-65"
                        {{else}}
                            class="step-a step o-65"
                        {{/if}}
                      >{{= noPage.num}}</a>
                 {{/each}}
             </div>
             <div class="position-control-c device-mobile">
                  <a href="javascript:loadMoreInfo();" class="step-f on o-65">查看更多
                    </a>
             </div>
             <div class="position-control-b device-pc">
                {{if pageModel.page < pageModel.pageNo}}
                    <a href="{{= pageModel.url + 'page='+ pageModel.nextNo}}" class="step-f on o-65">下一页
                    </a>
                {{else}}
                    <a href="javascript:void(0);" class="step-f invaild o-25">下一页
                    </a>
                {{/if}}
             </div>
             <div class="device-pc">
             <a href="{{= pageModel.url + 'page='+ pageModel.endPgNo}}" class="step-f on o-65 device-pc">末页</a>
             </div>
        </div>
    </div>
{{/if}}
</script>
<script type="text/javascript">
    $(function () {

    })
    function pageInit(data,targetId) {
        // 页码信息
        var pageNumList = [];
		var page = data.pageModel.page;
		var totalPg = data.pageModel.endPgNo;
        var beginPg = page>totalPg-2?totalPg-4:page-2;
        var endPg = page<3?5:page+2;
		beginPg = beginPg>1?beginPg:1;
		endPg = endPg>data.pageModel.endPgNo?data.pageModel.endPgNo:endPg;
        for(var i=beginPg;i<=endPg;i++){
            pageNumList.push({"num": i});
        }
        data.pageNumList = pageNumList;
        data.pageModel.url += "&";
        var htmlStr = $("#tmpl-page-style-1").tmpl(data);
        $(targetId).after(htmlStr);
    }
</script>

<script  id="tmpl-newsList-list" type="text/x-jquery-tmpl">
    {{if state}}

            {{each(i,item) pageModel.results}}

                                {{if item.contentIsTop == "1"}}
                                    <div class="label label-hot">置顶</div>
                                {{/if}}
                                {{if item.contentIsHot == "1"}}

                        <div class="news-images">

                                {{if item.picList && item.picList.length>0}}
                                    {{each(k,pic) item.picList}}

                                    {{/each}}
                                {{/if}}
                            </ul>
                        </div>
                    </a>
                </li>
            {{/each}}
        {{/if}}
    {{else}}
        <div>{{= errorMsg}}</div>
    {{/if}}
</script>
<script type="text/javascript">

    $(function () {
        //本月热门新闻列表初始化
        hotNewsList_Init();
		
        //数据分页
		getNewsPageList();
    })
	

	
	    //加载分页数据
	    function getNewsPageList(){
	        var menuId = getQueryVariable("menuId",window.document.location.search.substring(1));
	        var page = getQueryVariable("page",window.document.location.search.substring(1));
	        $.ajax({
		    url:'/upowweb/news/getNewsList',
	            type:"GET",
	            dataType:"json",
	            data:{
	                menuId:menuId,
	                page:page
	            },
	            success:function (data) {
	                if (data.state == true) {
	                    //初始化二级菜单
	                    newsNavListInit(data.menuId);
	                    data.pageModel.url = window.document.location.pathname+"?menuId="+data.menuId;
	                    //渲染数据
	                    var htmlStr = $("#tmpl-newsList-list").tmpl(data);
	                    $("#newsList-con").html(htmlStr);
	                    //渲染分页器
	                    pageInit(data,"#newsList-con");
	                    $.initEll();
	                }else{
	                    console.log(data.msg);
	                    console.log("查询失败");
	                }
	            },
	            error:function () {
	                console.log("系统繁忙！");
	            }
	        })
	    }	
	var pageIndex = 2;
	function loadMoreInfo(){
		var menuId = getQueryVariable("menuId",window.document.location.search.substring(1));
		$.ajax({
			url:'/upowweb/news/getNewsList',
			type:"GET",
			dataType:"json",
			data:{
				menuId:menuId,
				page:pageIndex
			},
			success:function (data) {
				if (data.state == true) {
					data.pageModel.url = window.document.location.pathname+"?menuId="+data.menuId;
					//渲染数据
					var htmlStr = $("#tmpl-newsList-list").tmpl(data);
					$("#newsList-con").append(htmlStr);
					//渲染分页器
					$("#pageBlock").remove();
					pageInit(data,"#newsList-con");
					$.initEll();
					if (data.pageModel.page == data.pageModel.endPgNo) {
						$(".news-con-list .page .position-control-c").css({display: "none"})
					} else {
						pageIndex = data.pageModel.nextNo;
					}
				}else{
					console.log(data.msg);
					console.log("查询失败");
					console.log(page);
				}
			},
			error:function () {
				console.log("系统繁忙！");
			}
		})
		
	}


	function getMenu(menu,menuid){
		if(menu!=undefined){
			var lop = menu.children;
			for(var i=0;i<lop.length;i++){
				if(lop[i].id==menuid){
					return menu;
				}else{
					var m = getMenu(lop[i],menuid);
					if(m!=undefined){
						return m;
					}
				}
			}
		}
		return undefined;
	}

	//获取本月热门新闻列表
	function hotNewsList_Init() {
		var timestamp = (new Date().valueOf());
		$.getScript(webRoot+"/resources/js/common/hotNewsList.js?v="+timestamp).done(function () {
			if (hotNewsList&&hotNewsList != null){
				var htmlStr = "";
				var data = {
					"hotNewsList":hotNewsList.data,
					"webRoot":webRoot
				}
				htmlStr = $("#tmpl-hot-news").tmpl(data);
				$("#hotNews").html(htmlStr);
			}
		})
	}

	//初始化二级菜单
	function newsNavListInit(menuid){
		$.getScript(webRoot+"/resources/js/common/navigationList.js").done(function () {
			if (navigationList&&navigationList != null){
				if (navigationList.top){
					var param = {children:navigationList.top};
					var menu = getMenu(param,menuid);
					var list = {
						"data":menu.children,
						"currentID":menuid
					}
					//创建新闻二级导航样式
					var htmlStr = $("#tmpl-news-nav-list").tmpl(list);
					$("#nav-list").html(htmlStr);
				}
			}
		})

	}

	//获取url参数
	function getQueryVariable(variable , urlStr) {
		var vars = urlStr.split("&");
		for (var i = 0; i < vars.length; i++) {
			var pair = vars[i].split("=");
			if (pair[0] == variable){
				return pair[1];
			}
		}
		return "";
	}
</script>
