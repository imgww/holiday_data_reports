<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4OelM7UqsGf</textarea><textarea class="article-author"> </textarea><textarea class="article-host">china.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">2025年国庆档影片多元化竞逐 《志愿军3》《震耳欲聋》等获高满意度评价</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">根据国家电影局统计，2025年国庆档电影票房为18.35亿元，观影人次为5007万。</textarea><textarea class="article-catnode">/e3pmh1nnq/e7tl4e309</textarea><textarea class="article-content"><article><section data-type="rtext"><p>根据国家电影局统计，<em data-scene="strong">2025年国庆档电影票房为18.35亿元，观影人次为5007万</em>；场次为314.66万场，同比增长12.82%；平均票价为36.64元，比去年同期降低3.75元，同比下降9.28%；国产影片票房占比为98.93%。档期内票房前5名影片分别为：《志愿军：浴血和平》《731》《刺杀小说家2》《浪浪人生》《震耳欲聋》。</p><p>截至10月8日，全年电影总票房已达437.89亿元，同比增长18.98%，比2024年全年总票房超出12.87亿元；观影人次10.35亿，同比增长19.39%，比2024年全年总人次超出2528万。</p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/aa57427d7be4d0e6a2f58d9bd6cb5ce1.png?imageView2/2/w/750" /></p><p>中国电影观众满意度调查･2025年国庆档调查结果显示，国庆档满意度得分85.4分，同比增长2.1分，为近四年最高。档期影片类型丰富、题材多样，满足假期观众多元化的观影需求。调查的7部影片中有3部超85分，战争题材的《志愿军：浴血和平》以87.2分居首，两部剧情片《震耳欲聋》《毕正明的证明》分居第二、第三位。</p><p><em data-scene="strong">国庆档三大指数及新鲜度同比提升</em><em data-scene="strong">《志愿军3》多维度领衔</em></p><p>2025年国庆档满意度调查的7部重点影片涵盖战争、剧情、动画、奇幻、喜剧等类型，内容供给兼具多元化、高品质特征，档期三大指数及新鲜度得分同比均有明显提升。其中三大指数得分都在85～86分之间，档期观赏性85.1分、思想性85.4分、传播度85.9分，整体表现较为均衡，档期新鲜度为83.0分，较去年同期均有所增长。</p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/2128c9a6298e821e6ff93f5a2fdf78a0.jpg?imageView2/2/w/750" /></p><p>从影片来看，作为抗美援朝“志愿军”三部曲终章的《志愿军：浴血和平》三大指数全面领衔，其中思想性得分88.0分，居2025年第二位，居第一的是《南京照相馆》88.9分，这两部影片都通过银幕再现残酷战争史实，承载着厚重的民族情感和历史责任感。</p><p>电影《震耳欲聋》三大指数都进入档期前三位，其中观赏性和思想性都为第二名。以绿皮火车时代“反扒”为题材的《毕正明的证明》传播度居档期第二位，首部三国题材动画片《三国的星空第一部》观赏性居档期第三位。</p><p>值得一提的是，档期新鲜度排名前三的影片都为IP系列续作，《刺杀小说家2》的顶尖特效和双向穿越叙事获赞，新鲜度84.0分居首位；《志愿军：浴血和平》“边打边谈”的双线叙事有效提升戏剧张力，《猪猪侠･一只老猪的逆袭》突破少儿定位、转向全龄化覆盖，两部影片新鲜度居第二、第三位。</p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/a885a5b939b3fd7cea35f882755bbede.png?imageView2/2/w/750" /></p><p><em data-scene="strong">IP续作及非系列化新作均有高满意度作品产出</em></p><p><em data-scene="strong">普通观众、专业观众对七部影片评价趋同</em></p><p>2025年国庆档调查的7部重点影片满意度都超过82分，其中3部超85分，且排名各位次的影片满意度都较去年同一位次高出1.2~2.4分不等。档期内有6部影片进入近三年国庆档TOP10，有4部影片进入2025年单片调查TOP15，且普通观众、专业观众评价排序较为一致，这都充分表明今年国庆档影片综合创作质量在线，得到了观众较好的满意度评价。</p><p>档期调查的3部IP续作满意度都较前作有所提升。《志愿军：浴血和平》以87.2分居档期首位，分别较系列第一部（《志愿军：雄兵出击》83.8分）、第二部（《志愿军：存亡之战》86.0分）提升了3.4分、1.2分。影片既有对残酷战役现场的宏大呈现，也深入刻画了谈判桌上的激烈博弈，得到了观众的高满意度评价，再度登顶国庆档满意度榜首。</p><p>时隔四年回归的奇幻巨制《刺杀小说家2》也在叙事手法、人物塑造和视觉呈现上进行了升级，满意度较前作高1.7分。《猪猪侠･一只老猪的逆袭》作为猪猪侠IP二十周年纪念之作，在原有的童趣、温情叙事中融入职场危机、反内卷等现实议题，较调查的上一部作品略高0.3分。</p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/69a4bb06a331a909420ac4793e70fd1f.jpg?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/bcd5a90070974eed12224561c78d825e.jpg?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/ffe5b9339b17c9484cac8b111b900e6a.jpg?imageView2/2/w/750" /></p><p>档期调查的非系列化新作包含三部现实向剧情片《震耳欲聋》《毕正明的证明》《浪浪人生》和一部动画片《三国的星空第一部》，整体满意度也表现较好。《震耳欲聋》充满人文关怀和现实深度，满意度85.7分居档期第二位。警匪题材的《毕正明的证明》节奏紧凑、观感沉浸，观众满意度85.2分居第三位。易中天担任编剧的动画电影《三国的星空第一部》以全新视角解构三国历史，满意度84.9分居第四位。国庆档唯一一部真人喜剧片《浪浪人生》幽默与温情兼备，观众满意度83.5分。</p><p>综合来看，国庆档影片创作质量在线，获得了观众较高的满意度评价。</p></section></article></textarea><textarea class="article-time">1760000189499</textarea><textarea cla
