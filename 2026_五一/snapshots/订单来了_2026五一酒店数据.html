       <script>window.__INITIAL_STATE__={"appState":{"user":{"isLogin":false,"userAgent":"Mozilla\u002F5.0 (Windows NT 10.0; Win64; x64) AppleWebKit\u002F537.36 (KHTML, like Gecko) Chrome\u002F120.0.0.0 Safari\u002F537.36","isSpider":false},"msg":[],"freeCoy":[]},"tdk":{"title":"订单来了发布《2026五一假期数据报告》，酒店入住率72%，民宿入住率63%，「县域小城游」持续高热-企查查","description":"原标题：订单来了发布《2026五一假期数据报告》，酒店入住率72%，民宿入住率63%，「县域小城游」持续高热，「票根经济」成住宿新引擎2026年5月6日，订单来...","keywords":"湖州全都来了网络科技有限公司怎么了","links":["\u003Cmeta name=\"referrer\" content=\"no-referrer\"\u002F\u003E","\u003Clink rel=\"canonical\" href=\"https:\u002F\u002Fnews.qcc.com\u002Fpostnews\u002Fe6def957908e1aa06f4ed099d9cd92cb.html\"\u003E"]},"home":{},"search":{"searchType":0,"searchKeyStore":""},"company":{"companyNav":[],"userCompany":{}},"people":{"peopleNav":[],"userPeople":{}},"singleApp":{"newsDetail":{"row":{"Content":"\u003Chtml\u003E\n \u003Chead\u003E\u003C\u002Fhead\u003E\n \u003Cbody\u003E\n  \u003Cdiv\u003E\n   　　原标题：\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_a32ec22ecdbc41dd087b4007a0f6f7b5.html\" target=\"_blank\"\u003E订单来了\u003C\u002Fa\u003E发布《2026五一假期数据报告》，酒店入住率72%，民宿入住率63%，「县域小城游」持续高热，「票根经济」成住宿新引擎\n   \u003Cp\u003E　　2026年5月6日，\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_a32ec22ecdbc41dd087b4007a0f6f7b5.html\" target=\"_blank\"\u003E订单来了\u003C\u002Fa\u003E行业数据中心正式发布《2026五一假期住宿市场数据报告》。该报告基于\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_a32ec22ecdbc41dd087b4007a0f6f7b5.html\" target=\"_blank\"\u003E订单来了\u003C\u002Fa\u003EPMS全量商家(覆盖超过25万家酒店和民宿)，统计周期为2026年4月30日至5月4日(共5个间夜)，从入住率、房价、客源结构及细分市场趋势等多个维度，对今年五一期间中国住宿市场的运行态势进行了全面复盘。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E一、核心数据概览：量稳价跌，结构分化\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E1.1 整体表现\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　报告显示，2026年五一假期，中国住宿市场呈现出\"入住率基本持平、平均房价小幅下行\"的总体特征。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E酒店板块：\u003C\u002Fstrong\u003E五日平均入住率为72.05%，同比微增0.88个百分点；平均房价(ADR)为395.13元\u002F间夜，同比下降11.92%。入住高峰出现在5月2日，当日入住率达84.54%，当日ADR为457.11元\u002F间夜。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E民宿板块：\u003C\u002Fstrong\u003E五日平均入住率为63.07%，同比下降2.58个百分点；平均房价(ADR)为664.10元\u002F间夜，同比下降9.70%。入住高峰同样在5月2日，当日入住率达79.77%，当日ADR为718.04元\u002F间夜。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082131583.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082131583.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E1.2 数据解读\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　从供需两侧分析，\"量稳价跌\"的格局反映了以下市场动态：\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E需求侧保持韧性。\u003C\u002Fstrong\u003E交通运输部数据显示，五一期间全社会跨区域人员流动量达15.3亿人次(日均3.05亿人次)，同比增长4%。全国营业性演出超3.44万场，票房收入20.84亿元，同比增长37.17%。宏观指标表明，居民出行和消费意愿整体稳健。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E供给侧竞争加剧。\u003C\u002Fstrong\u003E入住率基本持平背景下，ADR出现小幅下滑，价格竞争趋于激烈。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E二、四大核心趋势深度分析\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E趋势一：「县域小城游」持续高热，县域住宿从补充选项升级为独立增长极\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　2026年五一最显著的结构性趋势之一是县域目的地旅游的持续增长。多平台数据交叉验证了这一判断：\u003C\u002Fp\u003E\n   \u003Cp\u003E　　\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_f2f4f29192a11c87864adcd918127a7e.html\" target=\"_blank\"\u003E同程旅行\u003C\u002Fa\u003E数据显示，县域目的地旅行产品预订热度同比增长128%，县域高品质酒店预订热度增长76%，精品民宿预订量增长92%。\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_747d3a16e63342ba57c8771bde561a9e.html\" target=\"_blank\"\u003E抖音\u003C\u002Fa\u003E平台团购数据同样亮眼：山西运城团购销售额同比增长86%，山东济宁增长78%，安徽滁州增长58%。木鸟民宿则报告称三四线城市民宿订单实现翻倍增长，预订两城以上用户暴增170%。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E驱动因素分析：\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　第一，消费理性回归。消费者不再盲目追逐网红城市，转而主动寻找高性价比目的地。\"花更少的钱去更多的地方，住更好的房\"成为越来越多游客的选择。\u003C\u002Fp\u003E\n   \u003Cp\u003E　　第二，交通基础设施持续完善。高铁网络的加密使\"高铁+自驾\"的多城串游模式成为现实，三四线城市的可达性大幅提升。\u003C\u002Fp\u003E\n   \u003Cp\u003E　　第三，内容平台的种草效应下沉。\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_64f33caade82c0db342f8fcc5e5a416c.html\" target=\"_blank\"\u003E小红书\u003C\u002Fa\u003E和\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_747d3a16e63342ba57c8771bde561a9e.html\" target=\"_blank\"\u003E抖音\u003C\u002Fa\u003E上关于小众县城的内容持续增长，大量县域目的地因优质UGC内容而\"出圈\"。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E对住宿行业的意义：\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　县域住宿市场正在经历从\"大城市的补充选项\"到\"独立增长极\"的结构性转变。值得关注的是，连住7天以上的长住型订单增速显著，这类产品已跑出独立的增长曲线。对县域民宿经营者而言，现在是强化差异化定位、承接反向旅游溢出流量的关键窗口期。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E趋势二：「票根经济」成住宿新引擎，演出流量高效转化为住宿需求\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　2026年五一演出市场的火爆程度超出预期。文化和旅游部数据显示，假期全国营业性演出超3.44万场，票房收入20.84亿元，同比大幅增长37.17%。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082132466.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082132466.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E在此背景下，围绕演出门票衍生的「票根经济」模式正在快速成型：\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E政策层面\u003C\u002Fstrong\u003E，广东多地与上海虹口区率先推出\"票根联盟\"——凭演唱会票根即可享受酒店折扣、餐饮满减和景区减免等联动优惠。广东全省已有50余家景区参与票根联盟计划。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E商业层面\u003C\u002Fstrong\u003E，北京多家连锁酒店品牌在五月天鸟巢演唱会期间，通过\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_64f33caade82c0db342f8fcc5e5a416c.html\" target=\"_blank\"\u003E小红书\u003C\u002Fa\u003E面向粉丝群体开展精准营销，以票根核销为入口提供房价折扣、升房礼遇等增值服务，将演艺流量高效转化为住宿订单。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E数据印证\u003C\u002Fstrong\u003E：五一期间演出赛事行业交易笔数环比增长153%，电影演出类小程序打开次数增长98%。「跟着演出去旅行」已从概念走向规模化实践。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082132743.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082132743.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082133333.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082133333.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E趋势三：体育赛事经济崛起，「赛事+文旅」融合链路跑通\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　\"跟着赛事去旅行\"在2026年五一展现出强劲的商业潜力，以地方足球联赛为代表的体育赛事正成为住宿消费的新引擎。\u003C\u002Fp\u003E\n   \u003Cp\u003E　　\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_g198050cdd1d5f9699b92f6803d3bf3e.html\" target=\"_blank\"\u003E国家统计局江苏调查总队\u003C\u002Fa\u003E针对\"苏超\"联赛开展的专题调研提供了详实的量化依据：\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082133924.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082133924.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E可复制的「赛事+文旅」融合方法论已在多地落地\u003C\u002Fstrong\u003E： 广东佛山、潮州、汕尾等地推行\"赛事+非遗+美食嘉年华\"全时段消费场景，叠加粤超联赛与票根联盟政策，将吃住行游购娱全业态串联激活。\u003C\u002Fp\u003E\n   \u003Cp\u003E　　对住宿业经营者而言，提前锁定本地及周边赛事排期进行动态调价、针对性推出赛事住宿套餐，已成为收益管理的关键策略。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082133877.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082133877.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082134349.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082134349.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082134209.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082134209.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E趋势四：入境游加速复苏，目的地格局向二三线城市扩散\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　入境游市场在免签政策红利下持续回暖。交通运输部数据显示，五一期间免签政策入境外国人达43.6万人次，同比增长14.7%。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082135238.png\" src=\"http:\u002F\u002Fnews.cnair.com\u002Fuploadfile\u002F2026\u002F0508\u002F20260508082135238.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　更具结构性变化的，是入境游目的地的空间格局重组。\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_64f33caade82c0db342f8fcc5e5a416c.html\" target=\"_blank\"\u003E小红书\u003C\u002Fa\u003E于4月28日发布的《2026外国人来华旅游趋势报告》显示：外国用户发布的中国旅行相关笔记量同比增长5倍，外国游客足迹已覆盖近500座中国城市。二三线及县域目的地热度显著攀升。\u003C\u002Fp\u003E\n   \u003Cp\u003E　　典型案例：贵阳凭借\"民族风情+壮美山水\"的独特组合被韩国游客视为\"首尔平替\"，被欧美游客称为\"素食天堂\"，成功跻身入境游新兴热门目的地行列。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cimg _src=\"https:\u002F\u002Fimg2.danews.cc\u002Fupload\u002Fajax\u002F2026-05-07\u002FajaxKHKRwuCkBgFM.png\" src=\"https:\u002F\u002Fimg2.danews.cc\u002Fupload\u002Fajax\u002F2026-05-07\u002FajaxKHKRwuCkBgFM.png\"\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　五一数据报告也指出，泰国、越南和俄罗斯入境游客在华使用小程序频次明显提升，\"中国游+中国购+中国美食\"的消费决策链路正在形成，且目的地从传统门户城市向特色二三线城市加速扩散。\u003C\u002Fp\u003E\n   \u003Cp\u003E　　对住宿业的启示： 提前在非一线城市布局国际化接待能力的住宿品牌将获得先发优势。外卡支付解决方案、国际OTA渠道对接、针对外国游客的在地体验产品设计，这三项能力正从\"加分项\"变为\"必备项\"。\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E三、不同类型商家行动建议\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　基于以上趋势分析，报告针对不同业态的住宿经营者提出差异化的策略方向：\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E3.1 城市酒店：承接脉冲式跨城客流\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　1. 提前锁定本城演出排期与体育赛事日历\u003C\u002Fp\u003E\n   \u003Cp\u003E　　2. 推出「观演\u002F观赛+住宿」一体化套餐\u003C\u002Fp\u003E\n   \u003Cp\u003E　　3. 在社交媒体平台(\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_64f33caade82c0db342f8fcc5e5a416c.html\" target=\"_blank\"\u003E小红书\u003C\u002Fa\u003E\u002F\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_747d3a16e63342ba57c8771bde561a9e.html\" target=\"_blank\"\u003E抖音\u003C\u002Fa\u003E)开展精准粉丝营销\u003C\u002Fp\u003E\n   \u003Cp\u003E　　4. 配合票根经济政策设计权益核销流程\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E3.2 县域民宿：深耕反向旅游赛道\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　1. 在OTA和内容平台强化\"自然野趣\"和\"在地文化\"标签\u003C\u002Fp\u003E\n   \u003Cp\u003E　　2. 开发长住型产品(连住优惠\u002F周租月租\u002F数字游民套餐)\u003C\u002Fp\u003E\n   \u003Cp\u003E　　3. 关注多城串游用户的复合消费需求\u003C\u002Fp\u003E\n   \u003Cp\u003E　　4. 利用社交媒体直接触达目标客群\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E3.3 高端度假产品：布局入境游增量\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　1. 完善外卡支付解决方案\u003C\u002Fp\u003E\n   \u003Cp\u003E　　2. 对接国际OTA渠道(http:\u002F\u002FBooking.com\u002FAgoda\u002FExpedia等)\u003C\u002Fp\u003E\n   \u003Cp\u003E　　3. 设计针对外国游客的在 地体验产品\u003C\u002Fp\u003E\n   \u003Cp\u003E　　4. 提升多语言接待能力和国际化服务标准\u003C\u002Fp\u003E\n   \u003Cp\u003E\u003Cstrong\u003E四、数据说明与方法论\u003C\u002Fstrong\u003E\u003C\u002Fp\u003E\n   \u003Cp\u003E　　本报告所有住宿经营数据均来自\u003Cstrong\u003E\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_a32ec22ecdbc41dd087b4007a0f6f7b5.html\" target=\"_blank\"\u003E订单来了\u003C\u002Fa\u003EPMS系统\u003C\u002Fstrong\u003E全量商家，统计周期为2026年4月30日至5月4日(5个间夜)，数据截取时间为2026年5月6日12:00。\u003C\u002Fp\u003E\n   \u003Cp\u003E　　报告中引用的外部数据来源包括：\u003C\u002Fp\u003E\n   \u003Cp\u003E　　• 文化和旅游部(营业性演出场次及票房)\u003C\u002Fp\u003E\n   \u003Cp\u003E　　• \u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_g198050cdd1d5f9699b92f6803d3bf3e.html\" target=\"_blank\"\u003E国家统计局江苏调查总队\u003C\u002Fa\u003E(苏超联赛专题调研)\u003C\u002Fp\u003E\n   \u003Cp\u003E　　• \u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_78189c7d652ac1934affde427ac991a0.html\" target=\"_blank\"\u003E携程\u003C\u002Fa\u003E研究院(《2026年度五一出游总结报告》)\u003C\u002Fp\u003E\n   \u003Cp\u003E　　• \u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_64f33caade82c0db342f8fcc5e5a416c.html\" target=\"_blank\"\u003E小红书\u003C\u002Fa\u003E(《2026外国人来华旅游趋势报告》)\u003C\u002Fp\u003E\n   \u003Cp\u003E　　• \u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_f2f4f29192a11c87864adcd918127a7e.html\" target=\"_blank\"\u003E同程旅行\u003C\u002Fa\u003E、\u003Ca href=\"https:\u002F\u002Fwww.qcc.com\u002Ffirm_747d3a16e63342ba57c8771bde561a9e.html\" target=\"_blank\"\u003E抖音\u003C\u002Fa\u003E、木鸟民宿等平台公开数据\u003C\u002Fp\u003E\n   \u003Cp\u003E　　• 五一数据报告\u003C\u002Fp\u003E\n   \u003Cp\u003E　　• 交通运输部(跨区域流动数据)\u003C\u002Fp\u003E\n  \u003C\u002Fdiv\u003E\n \u003C\u002Fbody\u003E\n\u003C\u002Fhtml\u003E","ContentUrl":"http:\u002F\u002Fnews.cnair.com\u002Fc\u002F202605\u002F142392.html","Description":"","Id":"e6def957908e1aa06f4ed099d9cd92cb","ImgUrl":"https:\u002F\u002Fqcc-media-img.qichacha.com\u002FMediaSentimentImage\u002Fe6def957908e1aa06f4ed099d9cd92cb0.jpg||https:\u002F\u002Fqcc-media-img.qichacha.com\u002FMediaSentimentImage\u002Fe6def957908e1aa06f4ed099d9cd92cb1.jpg||https:\u002F\u002Fqcc-media-img.qichacha.com\u002FMediaSentimentImage\u002Fe6def957908e1aa06f4ed099d9cd92cb2.jpg","NewTags":"00000","NewsCompanyListWithLogo":[{"Count":4,"EntityType":0,"KeyNo":"a32ec22ecdbc41dd087b4007a0f6f7b5","Keywords":["订单来了"],"LogoUrL":"https:\u002F\u002Fimage.qcc.com\u002Flogo\u002Fa32ec22ecdbc41dd087b4007a0f6f7b5.jpg","Name":"湖州全都来了网络科技有限公司","Rate":1,"Senti":"positive","TitleMatch":true}],"NewsPersonList":[],"NlpFilter":1,"PublishTime":1778199658,"Senti":"positive","Source":"中国航空旅游网","SourceType":"999","Tag":"0000","TaggingCompanyInfoList":[{"company_keyno":"a32ec22ecdbc41dd087b4007a0f6f7b5","company_name":"湖州全都来了网络科技有限公司","entityType":0,"fromLLm":false,"hasLogo":1,"isLLm":false,"is_associated":true,"is_black_associated":false,"is_dynamic":1,"prior_words":["订单来了"],"senti":"positive","short_name":"订单来了","sim_func":"","sim_keyno":"","sim_score":0,"summary":"该报告基于订单来了PMS全量商家(覆盖超过25万家酒店和民宿)，统计周期为2026年4月30日至5月4日(共5个间夜)，从入住率、房价、客源结构及细分市场趋势等多个维度，对今年五一期间中国住宿市场的运...","titleMatch":1}],"Taggin
