<html><head><title>超1567万人次！湖南春节文旅业强势回暖</title></head><body><h1>超1567万人次！湖南春节文旅业强势回暖</h1><p>湖南省文旅厅发布数据，1月21日至27日，全省共接待游客1567.58万人次，同口径比2022年春节假期增长71.33%，同口径比2019年增长1.53%。</p><p>全省实现旅游综合收入159.88亿元，同口径比2022年春节增长66.45%，同口径比2019年增长5.05%。</p><p>过夜游客761.18万人次，一日游游客806.4万人次。</p><p>张家界武陵源核心景区和天门山景区分别接待游客19.75、16.33万人次，比2019年同期分别增长35%、47%。</p></body></html>
