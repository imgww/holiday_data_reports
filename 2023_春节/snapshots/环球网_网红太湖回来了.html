<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4BU4f8e41Yx</textarea><textarea class="article-author"> </textarea><textarea class="article-host">city.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">“网红太湖”又回来了！新春接待游客39.82万人次 实现收入6.14亿元</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">假日期间，度假区举办了太湖梅花节、东山山浪年味等节日文旅活动，林屋洞、香雪海等景区的梅花盆景展、梅香市集、汉服巡演、茶百戏等子活动受到游客的热烈欢迎，成为假日文旅市场的重要亮点</textarea><textarea class="article-catnode">/e3pmh1nv4/e3pmh1ojl</textarea><textarea class="article-content"><article><section data-type="rtext"><p>2023年春节长假期间，受益于疫情防控政策调整取得的成效和苏州国有景区免门票政策，太湖度假区旅游市场迎来强劲复苏。1月21日至27日七天假期，度假区共实现旅游目的地接待人次39.82万，实现旅游总收入6.14亿元，假日文旅市场规模接近2019年同期水平。</p><p><img data-alt="山浪文化节" src="//img.huanqiucdn.cn/dp/api/files/imageDir/8c3c3233bca5d2e4db2d83f9e5971a3a.png?imageView2/2/w/750" /></p><p>一是景区景点人气火爆。林屋洞、缥缈峰、陆巷、雕花楼、雨花胜境、香雪海、湖滨湿地、渔洋山等16个国有景点全部免门票向游客开放，7天各景区入园游客共25.39万人次，同比2022 年增长218%，创历史新高。其中，林屋洞、开心农场、陆巷古村入园人次位列前三，分别是4.26万、3.85万、3.53万人次。</p><p><img data-alt="林屋梅海游客众多" src="//img.huanqiucdn.cn/dp/api/files/imageDir/1c0c192e6a44bd97cd89e91b5e644318.png?imageView2/2/w/750" /></p><p>二是旅游市场强劲复苏。在接力去年苏州本地游出行的基础上，今年春节假期，上海及长三角周边城市游客成为度假区旅游市场主力客群。从出行方式来看，以自驾游出行为主，家庭亲子、亲朋好友出行为主要特色。香雪海、林屋洞赏梅游继续吸引众多游人。陆巷古村、明月湾等历史文化游受到游客青睐。新兴网红亲子项目开心农场在假日期间也十分火爆，初五接待游客10860人次，是各景区春节假期单</p><p>接待量之最。</p><p><img data-alt="山浪特色年味" src="//img.huanqiucdn.cn/dp/api/files/imageDir/62feab5e1494ccc9a0bee721cbce1bd8.png?imageView2/2/w/750" /></p><p>三是假日活动精彩纷呈。假日期间，度假区举办了太湖梅花节、东山山浪年味等节日文旅活动，林屋洞、香雪海等景区的梅花盆景展、梅香市集、汉服巡演、茶百戏等子活动受到游客的热烈欢迎，成为假日文旅市场的重要亮点。</p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/6c8041ce70bd954a67ddc9ff690df4fe.png?imageView2/2/w/750" /></p><p>四是酒店订房加速回暖。太湖湾酒店集群10家酒店总和客房入住率超80%，总营收超1400万元，创历史最佳业绩，平均房价约900元/间夜。初二、初三、初四三天，万丽酒店、万豪酒店、香山国际酒店、太美逸郡酒店、高尔夫酒店、假日酒店平均入住率约95%，基本满房。</p><p><img data-alt="香雪海围炉煮茶" src="//img.huanqiucdn.cn/dp/api/files/imageDir/71aedab4d676dbfdf8c1b76c3292f4a1.png?imageView2/2/w/750" /></p><p>五是头部民宿一房难求。湖与、雪绿、水庐、棕榈湾、望听、何必在熠等众多中高端民宿保持热度，继续呈现良好的经营态势。据介绍，假日期间金庭、光福两地的湖与民宿基本满房，订房热度将保持到本月底；何必在熠民宿业主自主管理的三家民宿也全部基本满房。</p><p>(太湖度假区供稿）</p></section></article></textarea><textarea class="article-time">1674972554634</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：张凯</textarea><textarea class="article-source-name"><a href="https://hs.china.com.cn/gd/66884.html" >中国网</a></textarea><textarea class="article-ext-xtime">1674972554634</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover">//img.huanqiucdn.cn/dp/api/files/imageDir/1f1187171a67d409cad34ec522863d66.png</textarea><textarea class="article-keyboarder">{"email":"zhangkai@huanqiu.com","name":"张凯"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><script>function decodeEntities(encodedString) {
