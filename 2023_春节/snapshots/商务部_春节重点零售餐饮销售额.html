<html><head><title>重点零售和餐饮企业春节假期销售额同比增长6.8%</title></head><body><h1>重点零售和餐饮企业春节假期销售额同比增长6.8%：消费市场实现开门红</h1><p>据商务部监测，全国重点零售和餐饮企业销售额与去年春节假期相比增长6.8%。</p><p>经文化和旅游部数据中心测算，今年春节假期全国国内旅游出游3.08亿人次，同比增长23.1%，恢复至2019年同期的88.6%；实现国内旅游收入3758.43亿元，同比增长30%，恢复至2019年同期的73.1%。</p><p>美团数据显示，春节假期新消费场景加速涌现，提灯夜游、雪橇冰车、非遗表演等新玩法走俏，美团上露营地相关的餐饮服务订单量同比增长272%。</p><p>去哪儿旅行数据显示，平台国内酒店预订间夜量达到历史新高，平均入住时长同比增长3.6小时。</p></body></html>
