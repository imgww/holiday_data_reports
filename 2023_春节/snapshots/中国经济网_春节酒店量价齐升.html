<html><head><title>酒店住宿业：兔年春节量价齐升</title></head><body><h1>酒店住宿业：兔年春节量价齐升，呈良好复苏态势</h1><p>据锦江酒店(中国区)经营数据显示，兔年春节全国酒店入住率、满房酒店数、RevPAR均创三年以来同期新高。</p><p>1月25日，锦江酒店(中国区)旗下全国酒店的综合RevPAR较去年同比提升94.4%，已接近恢复至疫情前水平。</p><p>1月23日及1月24日，锦江酒店旗下全国酒店平均入住率均超去年同期50%；满房酒店数连续四日较去年同期翻一番以上。</p><p>北海、大理、西双版纳、内江、三亚成为锦江酒店入住率排名前五城市。</p></body></html>
