<html><head><title>黄金周跨境支付火热</title></head><body><h1>黄金周跨境支付火热，银联卡境外POS日均交易额同比增超130%</h1><p>支付宝10月7日发布的出境游服务数据显示，国人整体出境游交易人数已恢复至2019年同期近8成，人均消费金额微涨至2019年的105%。</p><p>银联国际数据显示，"十一"前7天，境内游客使用银联卡在境外商户POS终端日均交易金额较去年同期增超1.3倍。出境游客经银联网络二维码完成的交易笔数较去年同期增长1.4倍，达到2019年同期的2.5倍。</p><p>携程数据显示，十一期间出境游订单同比增长超8倍。</p></body></html>
