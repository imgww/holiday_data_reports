<html><head><meta charset="utf-8"><title>春节假期海南离岛免税购物金额27.2亿元</title></head>
<body><h1>春节假期海南离岛免税购物金额27.2亿元，较去年增长30.8%</h1>
<p>2026年春节假期期间（2026年2月15-23日），海口海关共监管离岛免税购物金额27.2亿元，较去年春节假期增长30.8%；销售件数199.7万件，同比增长21.9%；购物人数32.5万人次，同比增长35.4%。</p>
<p>日平均购物金额、购物人数、购物件数分别为3.03亿元、3.6万人次、22.2万件，同比去年假期日平均值分别增长16.5%、20%、8.3%。</p>
<p>来源：海口海关/海南省商务厅 发布时间：2026-02-25</p>
</body></html>
