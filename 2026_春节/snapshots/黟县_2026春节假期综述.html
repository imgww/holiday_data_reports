<html><head><meta charset="utf-8"><title>黟县2026年春节假期综述</title></head>
<body><h1>黟县2026年春节假期综述</h1>
<p>2026年春节小长假9天，全县景区共接待游客461800人次，同比增长26.29%；门票收入1989.9万元，同比增长25.81%。</p>
<p>其中：西递接待游客71504人次，同比增长37.47%，门票收入453.91万元，同比增长42.87%；宏村接待游客204439人次，同比增长12.2%，门票收入1437.1万元，同比增长19.62%。</p>
<p>来源：黟县文化旅游体育局 发布时间：2026-02-23</p>
</body></html>
