<!DOCTYPE html><html><head><meta charset='utf-8'><title>超6亿人次!端午假期出行热</title></head><body><h1>超6亿人次!端午假期出行热</h1><p>2024年端午假期全社会跨区域人员流动量63761.6万人次，比2023年同期增长9.4%。铁路客运量4604.7万人次，比2023年同期增长5.1%；民航客运量553万人次，比2023年同期增长7.9%；水路客运量292.9万人次，比2023年同期增长4.4%。公路跨区域人员流动量58311万人次，比2023年同期增长9.5%。</p></body></html>
