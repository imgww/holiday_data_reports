<!DOCTYPE html><html><head><meta charset='utf-8'><title>端午假期四川891家A级旅游景区累计接待游客超1260万人次</title></head><body><h1>端午假期四川891家A级旅游景区累计接待游客超1260万人次、门票收入突破10939万元</h1><p>今年端午假期，四川省纳入统计的891家A级旅游景区累计接待游客1260.09万人次、门票收入10939.10万元，同比分别增长12.33%、6.23%，较2019年分别增长49.67%、53.85%。四川省图书馆、文化馆、博物馆累计接待群众212.1万人次。</p></body></html>
