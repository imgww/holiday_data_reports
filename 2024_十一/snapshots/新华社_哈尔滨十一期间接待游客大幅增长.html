<body><h1>哈尔滨"十一"期间接待游客大幅增长</h1>
<p>来源：新华社 2024-10-09</p>
<p>记者从哈尔滨市文化广电和旅游局了解到，据大数据统计，"十一"期间哈尔滨市累计接待游客835.7万人次，同比增长13.6%，实现旅游总花费56.3亿元，同比增长17.4%。</p>
<p>哈尔滨太平国际机场旅客吞吐量49.83万人次，同比增长5.2%；铁路运送旅客256.95万人次，同比增长23.3%；地铁线网总客运量787.9万人次，同比增长8.39%。10月1日至7日哈药六厂版画博物馆接待游客近10万人次，侵华日军第七三一部队罪证陈列馆到访游客8.32万人次。</p>
