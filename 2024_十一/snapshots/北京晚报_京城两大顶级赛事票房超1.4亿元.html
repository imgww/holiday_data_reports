<!DOCTYPE html><html><head><meta charset='utf-8'><title>为假期带来经济增量 京城两大顶级赛事票房超1.4亿元（北京晚报，2024-10-07）</title></head><body><h1>为假期带来经济增量 京城两大顶级赛事票房超1.4亿元（北京晚报，2024-10-07）</h1><p>中国网球公开赛票房总收入超8000万元，较去年上涨60%；全赛期观赛流量预计约30万人次，较去年增长约50%；中网综合消费额超2500万元，较去年增长近40%。WTT中国大满贯门票销售额约6000万元；首钢园9月26日至10月6日累计入园客流63.5万人次，其中10月1日至6日入园42.4万人次，同比增长93%；WTT中国大满贯带动首钢园区假日期间销售额超2500万元。</p></body></html>
