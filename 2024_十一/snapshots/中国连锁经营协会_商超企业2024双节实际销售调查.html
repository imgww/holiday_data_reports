<h1>中国连锁经营协会：商超企业2024年中秋、十一双节实际销售对比调查</h1>
<p>来源URL: <a href="https://npo13385d.npoall.com/news/itemid-49453.html">https://npo13385d.npoall.com/news/itemid-49453.html</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>中国连锁经营协会对全国43家商超企业开展2024年中秋节、国庆节（双节）各商品品类实际销售调查：餐桌商品（蔬菜、肉、豆腐、奶、熟食、调料）受青睐；健康消费引领（水果、0脂0糖饮料）；水产回暖、大单品爆量；高价酒水、礼品礼盒未发力；休闲食品再遇冷；销售高峰以3-7天居多。</pre>
