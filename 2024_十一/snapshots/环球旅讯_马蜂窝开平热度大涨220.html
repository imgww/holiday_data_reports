<h1>马蜂窝：广东开平旅游热度大涨220%</h1>
<p>来源URL: <a href="https://www.traveldaily.cn/article/184237/">https://www.traveldaily.cn/article/184237/</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>马蜂窝大数据显示，开平热度大涨220%；九寨沟热度环比涨幅高达300%；阿禾公路开通三日内热度上涨90%；热门出境游国家TOP10：日本、新加坡、泰国、马来西亚、格鲁吉亚、新西兰、印度尼西亚、澳大利亚、韩国、土耳其。</pre>
