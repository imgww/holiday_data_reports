<h1>华创证券《每周经济观察》：国庆假期趋势延续，量好于价</h1>
<p>来源URL: <a href="https://www.fxbaogao.com/detail/4527796">https://www.fxbaogao.com/detail/4527796</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>华创证券2024-10-07研报：10月1-4日社会跨区域人员流动量11.8亿人次，较2019年增长21.9%；国内热门城市机票预订量同比+14%、平均支付价格同比-13%；国内机票均价同比-20%；酒店均价同比约-4.5%（飞猪数据）；10月1-5日电影观影4216万人次+1.4%、票房17.1亿元-2%。</pre>
