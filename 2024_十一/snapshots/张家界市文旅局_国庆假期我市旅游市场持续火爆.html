<body><h1>国庆假期张家界旅游市场持续火爆</h1>
<p>来源：掌上张家界（澎湃号）2024-10-09</p>
<p>据市文旅部门测算，国庆期间，全市共接待游客152.86万人次，实现旅游收入15.13亿元，分别同比增长15%、8.5%。</p>
<p>10月3日武陵源核心景区迎客流高峰，入园游客达83594人，创下单日进山人数历史新高。</p>
