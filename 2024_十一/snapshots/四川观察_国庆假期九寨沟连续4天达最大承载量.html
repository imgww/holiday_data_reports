<body><h1>创新高！国庆假期九寨沟连续4天达最大承载量</h1>
<p>来源：四川观察（九寨沟管理局）2024-10-07</p>
<p>7日下午，四川观察记者从九寨沟管理局获悉，2024年国庆假期10月1日-10月7日，7天九寨沟景区共接待游客245290人次。10月2日至10月5日，接待游客达到最大承载量4.1万。连续四天达到最大承载量和国庆假期总接待人次均创下九寨沟景区开放以来的新高。</p>
<p>景区每日调配大巴观光车335辆，最高370辆；发放调查问卷1200余份，游客满意度达96%以上。</p>
