<h1>抖音生活服务：国庆期间地方菜团购订单+95%、景点票券订单+63%</h1>
<p>来源URL: <a href="https://www.stdaily.com/web/gdxw/2024-10/08/content_239473.html">https://www.stdaily.com/web/gdxw/2024-10/08/content_239473.html</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>抖音生活服务国庆假期平台消费趋势（10月1日至6日）：酒店住宿团购订单量同比+205%，地方菜餐饮团购订单量+95%，奶茶果饮+81%，短途游轮、景点票券订单量同比+512%、+63%；汉服体验、打铁花、灯会抖音团购量超去年2.5倍；山西小西天景区抖音团购订单量同比+5884%，山西菜团购订单量+237%。</pre>
