<h1>同程旅行《2024“十一”假期旅行消费报告》：深圳位列酒店预订最热城市</h1>
<p>来源URL: <a href="https://m.dutenews.com/n/article/8441437">https://m.dutenews.com/n/article/8441437</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>同程旅行《2024“十一”假期旅行消费报告》显示，深圳位列酒店预订最热城市第一位；热门酒店预订城市TOP10为：深圳、北京、成都、广州、重庆、上海、杭州、西安、苏州、南昌。四星级酒店预订热度同比上涨36%，四星酒店均价419元，五星763元、三星309元。</pre>
