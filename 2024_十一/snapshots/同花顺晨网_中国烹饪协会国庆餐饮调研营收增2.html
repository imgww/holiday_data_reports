<h1>中国烹饪协会《2024年国庆假期餐饮业经营情况调研》：营收+2.0%、客流+5.6%</h1>
<p>来源URL: <a href="http://news.10jqka.com.cn/field/20241127/663919545.shtml">http://news.10jqka.com.cn/field/20241127/663919545.shtml</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>中国烹饪协会“2024年国庆假期餐饮业经营情况调研”数据显示，受访餐饮企业假期营业收入与去年国庆假期7天相比上涨2.0%，客流量上涨5.6%；上海市商务委10月7日发布：国庆期间上海线下餐饮消费达到80亿元，同比两位数增长；国家税务总局增值税发票数据显示小吃、快餐行业销售收入同比分别增长8.1%和9%。</pre>
