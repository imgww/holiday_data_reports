<body><h1>2024国庆假期泰安市文旅市场持续火爆 泰山景区接待游客超40万</h1>
<p>来源：中华泰山网（泰安日报社）2024-10-08</p>
<p>2024年10月1日0时至10月7日16时，泰安全市纳入统计的22家旅游景区（点）共接待游客209.02万人次，同比增长11.94%，实现营业收入9256.69万元，门票收入5076.12万元。其中，泰山景区接待游客超40万人，2024年泰山景区已累计接待超700万名游客。</p>
<p>泰山索道共接待游客36.24万人次，实现收入3484.40万元。10月1日15000多名游客在泰山顶共迎国庆日出。全市发放金秋十月"乐宿泰安"惠民消费券50万元。</p>
</body></html>
