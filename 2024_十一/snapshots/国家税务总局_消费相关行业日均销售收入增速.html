<link rel="apple-touch-icon-precomposed" href="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg">
<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4JlaEHRc9Os</textarea><textarea class="article-author"> </textarea><textarea class="article-host">china.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">文旅融合出新出彩 消费市场活力涌动——2024年国庆假期盘点</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">“假日经济火热，彰显我国市场广阔，经济韧性强、潜力大，也让世界看到了一个活力满满的中国。”商务部研究院副研究员庞超然说。</textarea><textarea class="article-catnode">/e3pmh1nnq/e7tl4e309</textarea><textarea class="article-content"><article><section data-type="rtext"><p>新华社北京10月8日电 <em data-scene="strong">题：文旅融合出新出彩 消费市场活力涌动——2024年国庆假期盘点</em></p><p>新华社“新华视点”记者魏玉坤、王雨萧、严勇</p><p>金秋十月，山河锦绣。</p><p>大街小巷红旗飘扬，车站机场熙熙攘攘，热门景点人潮如织，影院剧场座无虚席……今年国庆假期，各地消费市场热气腾腾，流动中国生机勃勃，假日经济活力持续释放。</p><p><em data-scene="strong">“中国红”扮靓大江南北</em></p><p>10月1日清晨，12.3万人齐聚天安门广场，共同见证新中国75周年华诞这天五星红旗升起的历史瞬间。</p><p>伴随着国歌最后一个音符结束，五星红旗升至旗杆顶端，和平鸽和气球放飞至天空。人们意犹未尽，仍挥舞着手中的五星红旗。“我爱你，中国！”人群中爆发出热烈的欢呼声。</p><p>“中国红”，是这个国庆假期最引人注目的亮色。</p><p>在位于湖南桑植县的贺龙故居和贺龙纪念馆，一些年轻游客带着“盖章本”，在盖章区收集红色文物印章。“我们要继续传承和弘扬红色精神，不忘初心、砥砺前行。”安徽游客王晨有感而发。</p><p>南京长江大桥，桥头堡上红光闪耀；河北西柏坡纪念馆广场，“我与祖国共成长”主题活动吸引众多游客驻足；浙江嘉兴南湖畔，75名艺术工作者和75名少年儿童通过快闪的形式唱响歌曲《领航》……一抹抹“中国红”扮靓大江南北，献上对祖国的深切祝福。</p><p>打卡红色地标、探访革命旧址、欣赏红色剧目，已成为人们庆祝新中国华诞的一种潮流。美团数据显示，国庆假期，红色景区相关搜索量同比增长71.8%，红旗渠、遵义会议纪念馆、井冈山等景区最受游客欢迎。携程数据显示，假期红色旅游经典景区日均订单量同比增长70%。</p><p><em data-scene="strong">文旅融合释放活力</em></p><p>夜幕降临，华灯初上，西安大唐芙蓉园内，紫云楼、仕女馆等打卡点，簇拥着众多身着华服的游客。这个假期，大唐芙蓉园游客几乎天天爆满。</p><p>经文化和旅游部数据中心测算，国庆假期，全国国内出游7.65亿人次，按可比口径同比增长5.9%，较2019年同期增长10.2%；国内游客出游总花费7008.17亿元，按可比口径同比增长6.3%，较2019年同期增长7.9%。</p><p>“宝藏小城”持续破圈。飞猪数据显示，重庆武隆、海南陵水、新疆昆玉、云南普洱等地假期旅游预订量增速领跑全国。滴滴出行数据显示，三四线城市异地打车需求相比节前上涨130%。与“五一”假期相比，新疆阿勒泰、黑龙江伊春、吉林白山、甘肃武威等地日均异地打车需求涨幅均超160%。</p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/e10ab265ab064cc954f3fabfb1f90baf.JPG?imageView2/2/w/750" /></p><p><span data-scene="align-center">10月5日，游客在天坛公园祈年殿前游览。新华社记者 鞠焕宗 摄</span></p><p>各地坚持以文塑旅、以旅彰文，创新推出一批文旅新玩法、新场景，进一步释放消费潜力。</p><p>10月2日晚，一场非遗潮秀在海口骑楼老街上演。模特们身穿传统民族服饰走上T台，展示少数民族非遗服饰之美。国庆期间，各地通过非遗精品展、非遗民俗体验等方式举办近千场非遗主题活动，丰富旅游市场供给。</p><p>重视文化传承是今年国庆旅游市场的突出特点。美团数据显示，国庆假期，古建古寺相关搜索热度环比增长126%，人文古迹、展览馆等相关景区成为消费热度较高的景区品类。滴滴出行数据显示，前往古城、古镇类旅游景点打车需求相比节前上涨111%。</p><p>今年国庆档影片丰富，涵盖战争、动作、悬疑、科幻等类型和题材。根据国家电影局统计，国庆档（10月1日至7日）全国电影票房为21.04亿元，观影人次为5209万，其中国产影片票房为20.17亿元，占比为95.87%。</p><p>音乐节、演唱会等文娱活动异彩纷呈。国家税务总局增值税发票数据显示，假期电影放映、文艺创作与表演、数字文化服务销售收入同比分别增长18.7%、51.7%和178.7%。飞猪数据显示，举办文娱活动的杭州奥体中心体育馆、上海新国际博览中心等成为假期酒店预订热门商圈。</p><p><em data-scene="strong">新型消费蓬勃发展</em></p><p>夜市收摊时，早市小摊便搭起来了。这个国庆假期，长沙夜市和早市“无缝衔接”，24小时不打烊。</p><p>各地创新市场供给，推动24小时消费场景不断延展，消费活力持续攀升。国家税务总局增值税发票数据显示，国庆假期，消费相关行业日均销售收入同比增长25.1%。其中，小吃、快餐行业销售收入同比分别增长8.1%和9%；露营、民宿销售收入同比分别增长43.2%和6.3%。美团数据显示，国庆假期，全国生活服务到店消费较去年假期增长41.2%，其中游客日均消费同比增长69.6%。</p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/4e24800e5c92e02afaba9a42d60d35eb.jpg?imageView2/2/w/750" /></p><p><span data-scene="align-center">10月4日，游客在宁夏银川市贺兰县的图兰朵葡萄酒小镇参加篝火音乐会。新华社记者 毛竹 摄</span></p><p>在消费品以旧换新政策带动下，家电市场销售火热。京东数据显示，国庆假期家电销售额同比增长67%；苏宁易购全国门店假期客流同比提升超200%，以旧换新订单同比增长132%。</p><p>国庆假期，消费业态持续“上新”，新型消费蓬勃发展——</p><p>首店首发释放活力。HOKA全国首家形象店、安踏作品集重庆形象旗舰店……日前，超50家首店在重庆陆续开业。“假期来重庆旅游，抽空去自己喜欢的首店逛了逛，买了几件衣服。”江苏游客赵明达说。</p><p>体育消费日渐升温。国庆假期，北京、上海等多地体育赛事如火如荼，贵州“村超”足球友谊赛、云南帆船公开赛激发大众参与热情，“跟着赛事去旅行”展现度假新趋势。</p><p>一些外媒也捕捉到中国假日消费的活力。新加坡《海峡时报》网站报道称，中国国庆假期，人们纷纷涌入餐馆、商场和旅游景点。菲律宾《马尼拉时报》援引有关分析称，消费反弹，加上近期发布的一系列促增长政策，将为促进中国经济发展注入新动力。</p><p>“假日经济火热，彰显我国市场广阔，经济韧性强、潜力大，也让世界看到了一个活力满满的中国。”商务部研究院副研究员庞超然说。</p></section></article></textarea><textarea class="article-time">1728435364867</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：樊羽玮</textarea><textarea class="article-source-name"><a href="http://www.news.cn/fortune/20241008/335d7c9c96b24bfe8e33388067fa0dbb/c.html" >新华网</a></textarea><textarea class="article-ext-xtime">1728435364867</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover"></textarea><textarea class="article-keyboarder">{"email":"fanyuwei@huanqiu.com","name":"樊羽玮"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><script>function decodeEntities(encodedString) {
