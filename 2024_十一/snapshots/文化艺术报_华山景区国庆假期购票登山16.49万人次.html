<body><h1>华山景区国庆假期购票登山16.49万人次</h1>
<p>来源：文化艺术报 2024-10-09</p>
<p>今年华山景区国庆假日期间（10月1日6时至10月7日12时），旅游总人数达到57.74万人次，旅游综合收入7141.76万元。景区购票登山人数16.49万人次，门票收入2040.34万元，同比2023年增长47%和51%。</p>
<p>假日期间景区共接听咨询、求助、投诉等电话1310余个，接听率、办结率、满意率均为100%。</p>
