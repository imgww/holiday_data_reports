<body><h1>国庆假期阳朔遇龙河金龙巡游成网红打卡点</h1>
<p>来源：阳朔县委宣传部（新华网广西频道）2024-10-09</p>
<p>国庆期间，广西桂林市阳朔县遇龙河迎来客流高峰，景区共接待游客23.4万人次，同比增长65.63%。</p>
<p>遇龙河"金龙巡游"夜游项目国庆期间一票难求；景区在国庆前夕开通青厄渡码头至阳朔湾码头新航线，竹筏漂游航线由14条变为15条。</p>
