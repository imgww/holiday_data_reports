<h1>江西：国庆期间大众点评“必吃榜”商家日均订单量较9月增长50%</h1>
<p>来源URL: <a href="https://www.thepaper.cn/newsDetail_forward_28953599">https://www.thepaper.cn/newsDetail_forward_28953599</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>澎湃新闻：国庆期间，大众点评“必吃榜”商家日均订单量较9月增长50%；美团数据显示江西10月1-5日餐饮到店消费同比增长45.8%；饿了么餐饮日均订单同比增长85.6%。</pre>
