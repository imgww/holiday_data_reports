<h1>大众点评：近一周“渔村”“海岛”“海鲜”等关键词搜索量周环比增幅接近20%</h1>
<p>来源URL: <a href="https://news.sina.cn/2024-10-07/detail-incrssqf2120086.d.html">https://news.sina.cn/2024-10-07/detail-incrssqf2120086.d.html</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>大众点评数据显示，近一周“渔村”“海岛”“海鲜”等关键词周环比搜索量增幅接近20%；国庆节前30天餐饮搜索热度前五为咖啡、自助餐、海鲜、烤肉、奶茶。</pre>
