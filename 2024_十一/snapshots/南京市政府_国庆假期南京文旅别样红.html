<body><h1>迎客1543.8万人次，旅游总收入207.3亿元，外地游客占比超七成</h1>
<p>来源：南京日报（南京市文旅局）2024-10-08</p>
<p>市文旅局发布数据，经综合测算，国庆黄金周全市接待游客1543.8万人次，旅游总收入达207.3亿元，按可比口径较2023年同期分别上涨9%和7.9%，游客人均花费较"五一"假期提升12个百分点。</p>
<p>银联商务数据显示，全市文旅消费金额74亿元，同比上升18.2%，全省占比22.6%，其中外地游客在宁文旅消费高达42.3亿元。外地游客占比71.9%，较去年同期上升3.3%。景区景点接待游客量858.1万人次；文博场馆81.6万人次；登记住宿酒店平均入住率84.2%。</p>
