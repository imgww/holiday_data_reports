<body><h1>假期前6天内蒙古实现国内游客总花费124.22亿元 1767.08万人次打卡祖国北疆</h1>
<p>来源：内蒙古日报（人民网内蒙古频道）2024-10-08</p>
<p>内蒙古文旅厅数据显示，国庆假期前6天，内蒙古累计接待国内游客1767.08万人次，累计实现国内游客总花费124.22亿元。</p>
<p>内蒙古发布"歌游内蒙古"区域文旅品牌，推出20条精品旅游线路，各盟市谋划130项重点文旅活动。携程数据显示，国庆期间内蒙古旅游订单量同比增长15%，门票订单量同比增长23%，入境订单量同比增长23%，主要客源地为北京、上海、天津、沈阳、西安。</p>
</body></html>
