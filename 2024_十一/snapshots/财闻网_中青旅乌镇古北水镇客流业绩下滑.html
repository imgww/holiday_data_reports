<h1>中青旅：国庆假期乌镇、古北水镇客流量及业绩均下滑</h1>
<p>来源URL: <a href="https://www.caiwennews.com/article/1358528.shtml">https://www.caiwennews.com/article/1358528.shtml</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>财闻网2024-11-06：中青旅电话调研会议纪要披露，国庆假期两镇客流、营收同比均有所下降；原因包括今年假期同比去年少了一天高峰期、乌镇受天气降温影响、古北水镇受京郊游热度下降及长线游、出境游人数较多分流；2024年前三季度乌镇景区接待游客599.34万人次-2.68%，古北水镇100.25万人次-10.55%。</pre>
