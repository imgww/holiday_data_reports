<body><h1>国庆假期苏州累计接待游客1285.6万人次</h1>
<p>来源：苏州市政府办公室（江苏省人民政府网）2024-10-08</p>
<p>今年国庆假期，通信运营商数据显示，假日期间全市累计接待游客1285.6万人次；银联大数据显示，全市文旅消费金额达70.27亿元。</p>
<p>各景区景点累计推出近百项主题活动，组织群文活动290余场。发布"国庆游苏州"千万数字人民币文旅消费券。10月2日苏州地铁客流达307.4万人次，创历史最高纪录。</p>
</body></html>
