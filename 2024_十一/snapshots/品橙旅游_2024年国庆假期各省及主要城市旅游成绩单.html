<!DOCTYPE html><html><head><meta charset='utf-8'><title>数读：2024年国庆假期各省及主要城市旅游成绩单（品橙旅游，2024-10-09）</title></head><body><h1>数读：2024年国庆假期各省及主要城市旅游成绩单（品橙旅游，2024-10-09）</h1><p>各省人均消费：上海市以人均旅游消费1444.73元排名第一；破千元省份另有海南1388.27元、浙江1375.36元、新疆1343.04元、北京1244.88元、湖南1143.68元。主要城市人均消费：三亚市以人均旅游消费3033.82元排名第一，延吉市2081.05元位列第二。河南省以接待7991.6万人次、旅游收入565.9亿元位列省级双第一。</p></body></html>
