<!DOCTYPE html><html><head><meta charset='utf-8'><title>途家：十一平台迎来客流高峰，县域民宿预订量同比增五成（网易，2024-10-08）</title></head><body><h1>途家：十一平台迎来客流高峰，县域民宿预订量同比增五成（网易，2024-10-08）</h1><p>途家民宿数据显示，截至10月7日，今年十一期间热门城市民宿量涨价跌：预订量同比去年小幅上涨，预订价格同比便宜近两成；县域民宿预订增速同比增长近五成，增速跑赢大盘。途家平台上，县域民宿保持高增速，预订量同比增长超五成，平台客人足迹覆盖1393个县。从县域民宿预订增速看，四川九寨沟县预订量同比增长1.8倍排名第一。</p></body></html>
