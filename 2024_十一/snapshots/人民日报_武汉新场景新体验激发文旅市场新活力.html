<body><h1>湖北武汉 新场景、新体验激发文旅市场新活力</h1>
<p>来源：人民日报 2024-12-02（数据来源：武汉市文化和旅游局）</p>
<p>今年国庆期间，武汉共接待游客2191.56万人次，旅游总收入达211.73亿元，年轻游客在武汉旅游市场中的占比显著提高。</p>
<p>木兰不夜城今年国庆期间共计接待游客突破20万人次，同比增长34%。今年1—10月，武汉市共举办营业性演出25167场。今年春季"相约春天赏樱花"活动期间武汉共接待游客3363.86万人次，实现旅游收入395.03亿元。</p>
