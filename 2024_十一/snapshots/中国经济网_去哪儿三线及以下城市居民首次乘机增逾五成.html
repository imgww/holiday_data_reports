<h1>去哪儿：600余个三线及以下城市和县城居民首次乘机，首次购票量同比增逾五成</h1>
<p>来源URL: <a href="http://www.ce.cn/xwzx/gnsz/gdxw/202410/09/t20241009_39161137.shtml">http://www.ce.cn/xwzx/gnsz/gdxw/202410/09/t20241009_39161137.shtml</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>去哪儿数据显示，国庆假期600余个三线及以下城市和县城居民首次乘坐飞机，首次购买机票量同比增逾五成，首次购买出国机票量同比增逾七成；三线及以下城市居民出境游订单量同比增长近3倍。中国旅游研究院（文化和旅游部数据中心）客流大数据监测显示，国庆期间入出境游客人数合计518万人次。</pre>
