<h1>去哪儿：国庆异地外省游占比超六成，热门城市景区门票量较2019年增长3倍</h1>
<p>来源URL: <a href="https://news.sina.cn/2024-10-07/detail-incrttzr4816185.d.html">https://news.sina.cn/2024-10-07/detail-incrttzr4816185.d.html</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>去哪儿数据显示，2024年国庆假期异地外省游占比超六成；热门城市景区门票量较2019年增长3倍，单日峰值创历史新高。</pre>
