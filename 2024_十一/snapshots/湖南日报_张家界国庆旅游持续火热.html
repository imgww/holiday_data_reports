<!DOCTYPE html><html><head><meta charset='utf-8'><title>张家界国庆旅游持续火热（湖南日报/中国新闻网，2024-10-08）</title></head><body><h1>张家界国庆旅游持续火热（湖南日报/中国新闻网，2024-10-08）</h1><p>国庆假期，张家界市纳入监测的24家监测旅游区(点)共接待游客98.36万人次，重点监测的10家酒店、民宿在国庆期间入住率均超过90%。武陵源核心景区接待进山游客303189人次（+11.02%），天门山221916人次（+16.34%），大峡谷114740人次（+25.26%）。</p></body></html>
