<body><h1>"顶流"不赚钱，西安赚到了？</h1>
<p>来源：每日经济新闻 2024-10-13</p>
<p>七天假期西安共接待游客1754.60万人次，游客总花费172.37亿元，按可比口径分别增长6.23%、8.03%。西安国庆假期旅游人均花费已攀升至982元，高于成都（952元）、天津（908元）、广州（781元）、长沙（776元）等城市。</p>
<p>大唐不夜城板块上半年实现营收3938.3万元，净利润仅23.53万元（曲江文旅2024年半年报）。</p>
