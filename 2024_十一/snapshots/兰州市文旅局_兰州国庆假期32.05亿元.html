<body><h1>32.05亿元！兰州国庆假期文旅市场火爆</h1>
<p>来源：澎湃新闻·澎湃号（兰州市文旅局）2024-10-08</p>
<p>9月30日12时至10月7日12时，全市累计接待游客540.914万人次，同比增长30%，比2019年同期增长51.11%；实现旅游总花费32.05亿元，同比增长30.5%，比2019年同期增长29.39%，两项指标均达到有统计记录以来最高峰。</p>
<p>中山桥、金城关·黄河古渡景区累计接待游客96.92万人次，中山桥片区日接待游客最高超过20万人次。兰州铁路局假期发送旅客340万人次；中川机场完成旅客吞吐量40万人次。</p>
</body></html>
