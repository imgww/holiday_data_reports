<h1>太原：国庆假期通过同程平台预订太原旅游产品游客39.34万人次</h1>
<p>来源URL: <a href="https://www.taiyuan.gov.cn/zwyw/20241011/30167261.html">https://www.taiyuan.gov.cn/zwyw/20241011/30167261.html</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>太原市政府网：国庆假期通过同程平台预订太原旅游产品游客39.34万人次，相比2019年增长58.11%，过夜率61.37%；36家星级饭店接待游客5万人次、营收3680万元、入住率近90%。</pre>
