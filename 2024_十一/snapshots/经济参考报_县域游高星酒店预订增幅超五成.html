<h1>县域游持续走热：同程近百个县酒店预订热度涨幅超50%，去哪儿县域高星酒店预订增幅五成</h1>
<p>来源URL: <a href="http://jjckb.xinhuanet.com/20241007/9e38ae79b9794ca48be0ee24205f431b/c.html">http://jjckb.xinhuanet.com/20241007/9e38ae79b9794ca48be0ee24205f431b/c.html</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>经济参考报报道：同程旅行数据显示，热门县域目的地酒店预订增速超过大盘，预订热度同比涨幅超50%的县和县级市近百个；去哪儿数据显示，县域高星酒店预订增幅同比增长五成。</pre>
