<h1>同程旅行：山西临汾隰县小西天景区旅游热度同比上涨超20倍</h1>
<p>来源URL: <a href="https://www.ctnews.com.cn/dongtai/content/2024-10/09/content_165747.html">https://www.ctnews.com.cn/dongtai/content/2024-10/09/content_165747.html</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>同程旅行数据显示，山西临汾市隰县小西天景区旅游热度同比上涨超20倍；《黑神话·悟空》取景地带动山西古建游热潮；国庆期间博物馆旅游搜索热度环比上涨263%。</pre>
