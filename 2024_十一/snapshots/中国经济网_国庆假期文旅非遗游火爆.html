<!DOCTYPE html><html><head><meta charset='utf-8'><title>国庆假期文旅非遗游火爆（经济日报/中国经济网，2024-10-09）</title></head><body><h1>国庆假期文旅非遗游火爆（经济日报/中国经济网，2024-10-09）</h1><p>北京中轴线及沿线相关景点成为不少游客citywalk的重要线路：10月1日至6日，中轴线上天坛、鼓楼在抖音团购订单量同比增长达165%和133%，鸟巢和水立方增幅117%和82%。汉服体验、打铁花、灯会抖音团购量超去年2.5倍。因《黑神话·悟空》爆火的隰县小西天抖音团购订单量同比增长5884%。酒店住宿团购订单量同比增长205%，地方菜餐饮和奶茶果饮团购订单量增长95%和81%。</p></body></html>
