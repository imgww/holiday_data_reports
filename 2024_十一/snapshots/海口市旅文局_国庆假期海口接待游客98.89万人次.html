<body><h1>国庆假期海口接待游客98.89万人次 同比增长14.37%</h1>
<p>来源：海口日报（南海网）2024-10-08</p>
<p>记者从市旅文局获悉，今年国庆假期，海口市接待游客98.89万人次，同比增长14.37%；实现游客总花费11.98亿元，同比增长5.08%。</p>
<p>海口策划首届海口城市艺术周等文旅活动，斯巴达勇士赛海口站、"海口杯"篮球联赛总决赛等体育赛事相继举行。</p>
</body></html>
