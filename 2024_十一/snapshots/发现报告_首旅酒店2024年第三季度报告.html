<h1>首旅酒店2024年第三季度报告：国庆期间不含轻管理酒店全部酒店RevPAR 254元、同比+4.5%</h1>
<p>来源URL: <a href="https://www.fxbaogao.com/detail/4564061">https://www.fxbaogao.com/detail/4564061</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>首旅酒店2024年三季报（2024-10-30）：国庆节假日期间（10月1-7日），公司不含轻管理酒店的全部酒店RevPAR为254元，按可比口径同比增长4.5%；三季度不含轻管理酒店全部酒店RevPAR 195元、同比-6.0%；Q3营收21.56亿元-6.4%、归母净利润3.66亿元-9.5%。</pre>
