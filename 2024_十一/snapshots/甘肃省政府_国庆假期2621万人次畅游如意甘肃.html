<body><h1>国庆假期2621万人次畅游如意甘肃</h1>
<p>来源：甘肃日报（甘肃省文旅厅）2024-10-09</p>
<p>记者10月8日从省文旅厅获悉，2024年国庆假期，全省共接待游客2621万人次、旅游花费160.8亿元，按可比口径分别同比增长15.4%和18.8%。</p>
<p>全省7家5A级旅游景区和敦煌莫高窟共接待游客110万人次，较上年同期增加17万人次；麦积山大景区接待游客同比增长47.91%；全省各级各类博物馆接待游客近170万人次。敦煌鸣沙山月牙泉景区国庆专场"万人星空演唱会"上演。</p>
</body></html>
