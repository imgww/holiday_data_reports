<!DOCTYPE html><html><head><meta charset='utf-8'><title>北京首旅酒店(集团)股份有限公司2024年第三季度报告（上交所，2024-10-30）</title></head><body><h1>北京首旅酒店(集团)股份有限公司2024年第三季度报告（上交所，2024-10-30）</h1><p>今年国庆节假日期间（10月1-7日），公司不含轻管理酒店的全部酒店RevPAR为254元，按可比口径同比增长4.5%，得益于公司坚持精细化运营及积极营销管理。2024年第三季度，全部酒店RevPAR 170元（-7.8%），平均房价244元（-5.5%），出租率69.7%（-1.8pct）；不含轻管理酒店的全部酒店RevPAR 195元（-6.0%），平均房价264元（-4.7%），出租率73.9%（-1pct）。</p></body></html>
