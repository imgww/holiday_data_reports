<!DOCTYPE html><html><head><meta charset='utf-8'><title>2024年国庆节假期国内出游7.65亿人次（新华社/中国政府网，2024-10-08）</title></head><body><h1>2024年国庆节假期国内出游7.65亿人次（新华社/中国政府网，2024-10-08）</h1><p>经文化和旅游部数据中心测算，假日7天，全国国内出游7.65亿人次，按可比口径同比增长5.9%，较2019年同期增长10.2%；国内游客出游总花费7008.17亿元，按可比口径同比增长6.3%，较2019年同期增长7.9%。全国营业性演出4.43万场次（+14.5%），票房收入22.09亿元（+25.9%），观众1169.7万人次（+13.3%）；国家级夜间文化和旅游消费集聚区夜间客流量9686.23万人次。</p></body></html>
