<!DOCTYPE html><html><head><meta charset='utf-8'><title>国庆长假全国游客外卖量环比增长超50%，广深居全国前十（南方+，2024-10-06）</title></head><body><h1>国庆长假全国游客外卖量环比增长超50%，广深居全国前十（南方+，2024-10-06）</h1><p>据饿了么联合飞猪、尼尔森IQ共同发布《2024轻松出行趋势洞察》报告，国庆长假以来（10月1日-10月3日），全国游客外卖量环比增长超过50%。上海、杭州、北京、苏州、南京、武汉、广州、深圳、长沙和成都为国庆假期轻松出行人气最高前十城市。山西朔州游客外卖量周环比增长170%。从便利店送往酒店外卖量环比增长超过80%，同比去年增长100%。</p></body></html>
