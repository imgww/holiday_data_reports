<h1>途牛《2024国庆出游趋势预测》：国内长线游出游人次占比52%</h1>
<p>来源URL: <a href="http://www.ce.cn/xwzx/gnsz/gdxw/202409/27/t20240927_39153391.shtml">http://www.ce.cn/xwzx/gnsz/gdxw/202409/27/t20240927_39153391.shtml</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>途牛《2024国庆出游趋势预测》（截至9月20日预订）：国内长线游出游人次占比达52%，5-6天行程出游人次占比40%；31%用户选择“前拼”出游，拼假方案12%。</pre>
