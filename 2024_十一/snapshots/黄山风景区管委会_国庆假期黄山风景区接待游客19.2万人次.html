<body><h1>国庆假期黄山风景区接待游客19.2万人次</h1>
<p>来源：安徽日报（新华网安徽频道）2024-10-09</p>
<p>10月8日，记者从黄山风景区管委会获悉，今年国庆假期，黄山风景区共接待游客19.2万人次，游客接待总数与2023年国庆8天接待量持平，日均同比增长14%。</p>
<p>黄山风景区推出鱼灯舞、黎阳仗鼓等徽州非遗文化展演及版画制作、茶艺制作等徽州传统技艺体验项目。</p>
