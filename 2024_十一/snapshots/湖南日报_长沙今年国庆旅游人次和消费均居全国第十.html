<body><h1>权威发布：长沙今年国庆旅游人次和消费均居全国第十</h1>
<p>来源：湖南日报·新湖南客户端 2024-10-12</p>
<p>根据手机信令大数据建模分析显示，2024年国庆假期7天，长沙市共计接待游客近千万人次（952.06万人次），游客总花费达73.88亿元。国庆假期受访游客平均在长停留2.64天，人均花费1779.92元。</p>
<p>根据携程平台数据，长沙市位列全国城市消费金额和到达人次排行榜前10位，同比增长均在10%以上。第三届长沙市旅游发展大会直接拉动文旅投资106.63亿元。</p>
</body></html>
