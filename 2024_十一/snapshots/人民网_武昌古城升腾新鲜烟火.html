<body><h1>古朴与现代交融 武昌古城升腾新鲜烟火</h1>
<p>来源：人民网（中国环境网转载）2024-10-16</p>
<p>2024年国庆假期，黄鹤楼公园7天共接待游客25.15万人次。武汉市武昌区旅游热度爆棚，吸引488.55万人次共赴国庆盛宴。沉淀600多年历史的昙华林老街国庆假期接待游客51.22万人次。</p>
<p>武昌古城斗级营成为文旅消费新地标，黄鹤楼公园推出"夜上黄鹤楼"沉浸式夜游及"梦回太白"对诗互动等项目。</p>
