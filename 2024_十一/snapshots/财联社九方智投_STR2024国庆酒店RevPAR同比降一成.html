<h1>财联社（转引STR）：2024年国庆假期酒店RevPAR较2023年同比降一成</h1>
<p>来源URL: <a href="https://www.9fzt.com/9fztgw_1_top/2ed31c31842fc9c3d45e2dc1705ffa2c.html">https://www.9fzt.com/9fztgw_1_top/2ed31c31842fc9c3d45e2dc1705ffa2c.html</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>财联社2025年10月4日报道：根据STR数据，2024年国庆假期的酒店RevPAR较2023年同比降了一成，市场表现较差；2025年在中秋国庆连休8天、低基数及政策带动下回温。</pre>
