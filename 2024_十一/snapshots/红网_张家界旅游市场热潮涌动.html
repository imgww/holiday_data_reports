<body><h1>国庆假期张家界旅游市场热潮涌动</h1>
<p>来源：红网时刻 2024-10-08</p>
<p>根据省文旅厅湖南文旅统计综合平台系统监测，国庆假期张家界市纳入监测的24家监测旅游区(点)共接待游客98.36万人次，重点监测的10家酒店、民宿在国庆期间入住率均超过90%。</p>
<p>武陵源核心景区接待进山游客303189人次，同比增长11.02%；天门山景区接待游客221916人次，同比增长16.34%；大峡谷景区接待游客114740人次，同比增长25.26%。七星山接待游客16452人次，同比增长33.27%；七十二奇楼接待游客96956人次，同比增长39.31%。</p>
</body></html>
