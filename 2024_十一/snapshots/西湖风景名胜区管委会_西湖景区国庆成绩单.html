<body><h1>共接待游客422.60万人次！西湖景区国庆"成绩单"新鲜出炉</h1>
<p>来源：潮新闻 2024-10-08</p>
<p>据西湖风景名胜区管委会数据，今年的国庆长假，西湖景区共接待游客422.60万人次，与2023年同比增长30.92%。其中收费公园客流量102.97万人次，客流排名前三的依次是灵隐飞来峰、三潭印月、动物园。</p>
<p>10月3日游客接待量最高，共接待客流量98.27万人次，与2023年同比增长55.89%。</p>
