<body><h1>青岛假日经济图景</h1>
<p>来源：青岛财经网（澎湃号）2024-10-10</p>
<p>记者从青岛市商务局获悉，假期期间全市10大重点商贸监测企业（集团）实现销售额11.7亿元，同比增长10.8%。</p>
<p>节日期间，青岛市累计销售家电17.8万台，销售金额6.9亿元；汽车报废、置换更新共申领3200多辆。"菜篮子"市场供应充足，5大批发市场交易蔬菜1.95万吨，日均2791.7吨。</p>
