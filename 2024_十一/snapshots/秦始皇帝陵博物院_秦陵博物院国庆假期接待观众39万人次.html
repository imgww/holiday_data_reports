<html lang="zh-CN"><head><meta charset="utf-8"><title>秦陵博物院国庆假期接待观众39万人次</title></head>
<body><h1>秦陵博物院国庆假期接待观众39万人次</h1>
<p>来源：秦始皇帝陵博物院（陕西省文物局网）2024-10-08</p>
<p>国庆节期间，秦始皇帝陵博物院共接待观众390722人次，参观秩序平稳有序。</p>
<p>"千古一帝的地下王国——秦始皇陵考古发现展"成为观众打卡参观的新热点。该院统筹安排提前10天开放假期票务预约通道。</p>
</body></html>
