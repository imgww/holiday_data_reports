<h1>飞猪《2024国庆假期出游快报》：出境游预订量同比劲增超50%</h1>
<p>来源URL: <a href="https://m.guancha.cn/qiche/2024_10_08_751045.shtml">https://m.guancha.cn/qiche/2024_10_08_751045.shtml</a></p>
<p>采集时间: 2026-09-09 16:30 | 观测批次: R5</p>
<pre>飞猪《2024国庆假期出游快报》：国庆假期出境游预订量同比劲增超50%，国际酒店预订规模恢复至2019年约120%；国内高星酒店预订量同比增长近40%，旅游套餐预订量增长近40%。</pre>
