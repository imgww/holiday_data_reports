<body><h1>899.27万人次、472.4亿元！云南国庆假期旅游相关数据再创新高</h1>
<p>来源：云南日报 2024-10-09</p>
<p>10月8日，云南国庆假日旅游成绩单出炉。全省旅游花费达472.4亿元，按可比口径增长8.9%。全省189家4A级以上旅游景区累计接待游客899.27万人次，按可比口径增长9.91%。其中，纳入重点监测的45家A级旅游景区共接待游客343.79万人次，按可比口径增长14.92%。</p>
<p>云南"十一"出入境游订单创新高：出境游订单量同比增长42%，入境游订单量同比增长147%（平台数据）。全省组织群众文化活动3200多场，惠及群众近7000万人次。</p>
</body></html>
