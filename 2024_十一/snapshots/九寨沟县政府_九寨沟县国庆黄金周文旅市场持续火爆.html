<body><h1>九寨沟县2024年国庆"黄金周"假期文旅市场持续火爆，再创新高！</h1>
<p>来源：九寨沟县文广体旅局（九寨沟县人民政府）2024-10-09</p>
<p>10月1日至10月7日，全县累计接待游客42.07万人次，同比增长41.94%，实现旅游收入48380.50万元，同比增长57.65%。九寨沟景区连续4天每日接待游客达到景区最大承载量4.1万人，累计接待24.78万人，同比增长45.95%。</p>
<p>神仙池景区累计接待8409人、甲勿海·熊猫园景区累计接待4635人、九寨华美胜地旅游度假区累计接待11008人，游客接待量均创历史新高。</p>
</body></html>
