<body><h1>国庆假期1614.2万人次游郑州；郑州国庆消费市场"成绩单"出炉</h1>
<p>来源：郑州发布（郑州市委宣传部官方澎湃号）2024-10-09</p>
<p>综合大数据监测、抽样调查和区县（市）统计，国庆假期全市接待游客1614.2万人次。</p>
<p>郑州市商务局监测报告：10月1日至7日，来郑人数1902万人次，省外占比25.32%；停驻二七商圈、CBD商圈、高铁站商圈、花园路商圈、中原商圈等重点商圈约1555.24万人次。重点监测的10家大型商业综合体累计客流量583.65万人次，同比增长28.59%；累计营业额4.75亿元，同比增长11.68%。郑州铁路累计发送旅客568.5万人次，较2023年同期增长9%。</p>
