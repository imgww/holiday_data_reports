<!DOCTYPE html><html><head><meta charset='utf-8'><title>2024年国庆黄金周数据发布：三亚高星级酒店业绩表现</title></head><body><h1>2024年国庆黄金周数据发布：三亚高星级酒店业绩表现</h1><p>2024年国庆黄金周7天三亚高星级整体酒店市场平均出租率72.5%，比去年同期上涨9.6%；平均房价1305元，比去年同期下降25.1%。分区域：亚龙湾出租率78.8%（+17.6%）、房价1435元（-24.6%）；海棠湾72.0%（+4.0%）、1751元（-27.0%）；三亚湾60.1%（+10.1%）、583元（-27.6%）；三亚市区（含大东海）76.5%（+9.3%）、823元（-12.8%）。13家高端酒店平均出租率74.5%（+1.5%）、平均房价2093元（-24.7%）。</p></body></html>
