<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">9CaKrnJXZ3H</textarea><textarea class="article-author"> </textarea><textarea class="article-host">finance.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">8819亿 黄金周刷卡消费创新高</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">中国银联发布国庆长假期间银联卡交易数据，10月1至7日银联网络交易金额达到8819亿元。</textarea><textarea class="article-catnode">/e3pmh1hmp/e3pn61chp</textarea><textarea class="article-content"><article><section data-type="rtext"><p>中国银联8日发布国庆长假期间银联卡交易数据，10月1日至7日银联网络交易总金额达到8819亿元，交易总笔数5.7亿笔，较去年同期分别增长36%和14%，继续创下历年来黄金周新高。</p><p>日常消费持续活跃，“一带一路”沿线国家地区交易量增长显著</p><p>从消费结构来看，国庆期间银行卡日常类消费仍保持较高增速，宾馆餐饮、旅游出行和百货购物等行业的消费需求较为旺盛。贵州、宁波和新疆地区是今年国庆黄金周日常消费笔数增长最快的地区，较去年同期增幅均超过50%。</p><p>在居民日常消费方面，以超市、百货和大型家电销售等为代表的日常购物类消费较为活跃，交易笔数同比增幅达到22%。走亲访友、亲朋团聚也推动了国庆长假7天餐饮消费量的攀升，交易笔数同比增长33%。</p><p>银联公布的旅游出行用卡交易数据显示，黄金周期间，全国大型景区售票与宾馆消费笔数同比分别增长46%与17%。航空、铁路和公路等客运消费笔数合计增长78%，其中公路增幅最高，达102%。上海、黑龙江和山东等地客运售票交易量增幅最大，成为黄金周期间出行意愿增长最明显的地区。同时，由于全国大部分地区天气晴好，高速公路推出免费通行的惠民政策，带动与自驾出行相关的加油类消费笔数增长48%，其中西藏、上海和海南地区同比增幅最大，均超过100%。</p><p>“近些年私家车日益普及，以及小客车高速免费通行的惠民政策推出，自驾出行备受青睐。”中国银联数据分析师陈汉认为，近年来黄金周旅游出行类银行卡交易的增长，从一个侧面反映出旅游消费的火热和居民消费的不断升级，也是居民生活水平不断提高的重要表现。</p><p>境外消费数据显示，今年黄金周期间，相比日本、韩国、泰国等短途出境游目的地，以加拿大、英国、西班牙、俄罗斯等为代表的欧美国家更受游客青睐。随着“一带一路”沿线国家和地区的银联卡使用范围持续扩大，当地银联卡交易量增长显著。</p><p>用卡环境持续改善，创新支付方式更受青睐</p><p>数据还显示，随着我国银行卡用卡环境的持续改善，越来越多的消费者将刷银行卡作为日常消费的主要支付手段，一些创新的支付方式也正受到更多消费者喜爱。</p><p>陈汉介绍，与商务部公布的全国零售和餐饮企业消费10.7%的同比增幅相比，银联网络交易量的增速更快，这一方面体现了全国银行卡受理环境的持续优化，另一方面也反映了老百姓使用银行卡支付热情较高，体现出银行卡支付对黄金周期间消费的有力推动作用。</p><p>此外，日常消费领域中，银联卡创新支付方式正受到越来越多用户的青睐。金融IC卡交易笔数和交易额同比分别增长42%和66%，其中“一挥即付”（非接触式）支付方式的增长更为显著。以“云闪付”业务为例，随着支持的手机品牌与型号持续丰富，受理环境不断改善，国庆期间“云闪付”日均交易笔数和交易金额较“五一”小长假分别增长了89%和46%，在各类小额日常消费领域的交易增幅显著高于行业平均水平。“银联在线支付”的总交易笔数和总金额也分别同比增长65%和159%。</p><p>境外用卡方面，黄金周期间，银联卡境外线下交易金额和交易笔数保持增长势头，银联卡在日用百货、超市、餐饮、宾馆类商户的消费占境外交易额已超四成，说明银联卡受理网络的覆盖更加普遍，较好地满足了中国游客在境外体验本地生活的支付需求。</p><p>陈汉认为，良好的用卡环境已经成为很多中国消费者境外旅游时的重要体验之一，也是很多消费者选择旅游目的地的重要因素之一，不少网友在网上分享自己在假期中的境外用卡经历，如在英国比斯特购物村、阿联酋中餐馆等使用银联卡消费非常方便，在日本、捷克、津巴布韦等地用银联卡取现体验良好，并表示许多境外商户有银联卡专属优惠和服务。</p><p>假期后易遭诈骗，用卡安全需留意</p><p>近年来，随着各类金融诈骗行为的发生，银行卡用卡安全问题日益受到社会重视。犯罪分子容易利用假期前后人们放松警惕的时机实施诈骗，中国银联公布了近年来国庆长假期间银行卡诈骗的典型案例，提醒消费者注意假日期间和假期结束后的用卡安全。</p><p>例如，国庆期间李先生全家去美国自由行，回来后收到了一条短信，称某某银行推出回国后申请退税简易流程，只需拨打400开头的电话进行税款确认即可立即办理成功。李先生拨打该号码后，不法分子引诱其通过ATM（自动取款机）英文界面进行操作，输入所谓口头告知的“验证码”（实际上是转账金额）后，李先生的账户资金不翼而飞。</p><p>“假期结束后，消费者如果收到消费退款、消费退税类的短信不要轻易相信，有疑问请及时与发卡银行联系咨询，要坚决拒绝陌生人关于使用ATM转账的电话要求。”中国银联数据分析师王宇表示，近年来很多犯罪分子利用持卡人不熟悉ATM英文版界面的弱点，用各种借口迷惑持卡人在ATM上向犯罪分子账号进行转账操作，消费者遇到此类事件要引起警觉，不要轻易向陌生人的个人账户汇款。</p></section></article></textarea><textarea class="article-time">1476076080000</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：马晓春</textarea><textarea class="article-source-name"><a href="http://finance.people.com.cn/n1/2016/1010/c1004-28764396.html" >中国证券报</a></textarea><textarea class="article-ext-xtime">1476076080000</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover"></textarea><textarea class="article-keyboarder">{"email":"maxiaochun@huanqiu.com","name":"马晓春"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><script>function decodeEntities(encodedString) {
