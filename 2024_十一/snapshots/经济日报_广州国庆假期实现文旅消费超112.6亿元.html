<body><h1>广州：国庆假期实现文旅消费超112.6亿元</h1>
<p>来源：经济日报新闻客户端（中国经济网转载）2024-10-09</p>
<p>据统计，2024年国庆假期广州市接待游客1441万人次，同比增长3.7%；接待出入境游客25万人次，同比增长50%；实现文旅消费超112.6亿元，同比增长2.2%。</p>
<p>广州以"十一黄金周，快乐到广州"为主题策划推出两千余场假期文旅活动。国庆假期广州纳入监测的35家文化旅游景区共接待游客超1000万人次，其中14家重点景区共接待游客近289万人次。</p>
