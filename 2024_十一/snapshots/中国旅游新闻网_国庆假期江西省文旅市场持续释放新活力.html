<body><h1>国庆假期江西省文旅市场持续释放新活力</h1>
<p>来源：中国旅游新闻网 作者：记者 周晨 2024-10-09</p>
<p>记者日前从江西省文化和旅游厅获悉，国庆假期，江西省累计接待国内游客同比增长10.7%，其中外省游客占比31.03%，外省游客占比居全国第6位、中部第1位；国内游客花费同比增长6.94%。旅游人次和游客消费再创历史新高。</p>
<p>江西省文旅系统累计推出1400余项创意活动、400余项优惠措施，发放6000余万元文旅消费券。南昌八一广场升旗仪式吸引逾10万人次现场观礼；鹰潭龙虎山景区举办半程马拉松赛事，2万余人齐聚景区。</p>
