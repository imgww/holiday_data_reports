<html lang="zh-CN"><head><meta charset="utf-8"><title>湖南国庆消费市场热力十足</title></head>
<body><h1>人气、商气、烟火气持续升温——我省国庆消费市场热力十足</h1>
<p>来源：湖南日报（湖南省人民政府门户网站）2024-10-08</p>
<p>商务部监测数据显示，截至10月7日12时，国庆假期湖南重点监测的353家零售和71家餐饮企业共实现零售总额26.1亿元，较去年同期有所上涨。其中，零售业销售额25.8亿元，同比上涨0.5%。</p>
<p>长沙五一商圈国庆假期前6天消费总额14.64亿元，同比增长2.6%（银联商务监测）。截至10月6日，全省家电以旧换新国庆假期产生交易192728笔，销售金额8亿元。汽车置换更新：2258人申请，累计申领金额2532.4万元，购车金额3.49亿元。</p>
