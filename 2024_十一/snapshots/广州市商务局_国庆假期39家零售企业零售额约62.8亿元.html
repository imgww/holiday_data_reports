<body><h1>国庆假期广州39家零售企业实现零售额约62.8亿元</h1>
<p>来源：中国新闻网（广州市商务局）2024-10-08</p>
<p>广州市商务局8日通报，今年国庆假期期间，该市重点监测的39家零售企业实现零售额约62.8亿元，较2019年同期增长58.7%；10月1日至6日同比增长约8%。</p>
<p>10月1日至6日，天河路商圈客流量约1312.3万人次，同比增长10.7%；北京路商圈客流量335.4万人次，同比增长11.1%，预计总营收达8.05亿元，同比增长6%；长隆万博商圈客流量256.9万人次，同比增长26.9%。全市餐饮消费额约40亿元，同比增长超4%。广州家电线上线下销售金额超5亿元。</p>
