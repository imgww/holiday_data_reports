<body><h1>阳朔国庆假期接待游客近138万人次 跃居全国十大热门县域旅游目的地</h1>
<p>来源：桂林日报（桂林市人民政府网）2024-10-09</p>
<p>2024年国庆假期，阳朔接待游客137.97万人次，按可比口径比2023年同期增长28.55%；实现旅游总消费19.87亿元，按可比口径比2023年同期增长30.42%，跃居央视大数据平台全国十大热门县域旅游目的地之列。</p>
<p>遇龙河"金龙巡游"夜游项目9月30日推出，国庆期间共1004人乘坐金龙巡游遇龙河。"桂林千古情"10月3日、4日演出10场仍座无虚席。</p>
</body></html>
