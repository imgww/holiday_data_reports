<body><h1>贵州：国庆假期全省累计消费301.9亿元 同比增长7.59%</h1>
<p>来源：贵州日报 2024-10-09</p>
<p>10月8日，记者从贵州省商务厅获悉，今年国庆节假期，银联商务监测数据显示，国庆假期全省累计消费金额301.9亿元，同比增长7.59%，累计消费人次5610.02万，同比增长4.51%。</p>
<p>9个市州节日期间消费金额均快速增长，消费金额排名前三的地区是贵阳市、遵义市和毕节市，分别占全省整体的35.25%、17.27%、8.07%。消费品以旧换新：汽车换新消费9.38亿元、家电换新消费6.5亿元、家居换新消费1.12亿元。</p>
