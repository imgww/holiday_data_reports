<body><h1>国庆假期，重庆接待游客2268.35万人次，同比增长14.1%！</h1>
<p>来源：工人日报客户端（中工网）2024-10-09</p>
<p>10月7日，重庆市文化和旅游发展委员会发布数据显示，国庆假期重庆共接待国内游客2268.35万人次，同比增长14.1%；游客花费154.02亿元，同比增长15.8%。</p>
<p>截至10月7日18点，重庆市130家纳入监测统计的旅游景区累计接待游客846.12万人次，按可比口径增长13.1%。全市推出文旅活动超750场次、秋季旅游线路100余条、文旅惠民措施150余项。</p>
</body></html>
