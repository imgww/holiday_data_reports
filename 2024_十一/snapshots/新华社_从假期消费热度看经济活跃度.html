<!DOCTYPE html><html><head><meta charset='utf-8'><title>从假期消费热度看经济活跃度（经济参考报/新华网，2024-10-08）</title></head><body><h1>从假期消费热度看经济活跃度（经济参考报/新华网，2024-10-08）</h1><p>大麦平台数据显示，10月1日至10月6日，全国总演出场次同比增加28%，其中演唱会场次和观演人次均翻倍。飞猪《2024国庆假期出游快报》：出境游预订量同比劲增超50%，国际酒店预订规模恢复至2019年的约120%。美团：国庆前5天餐饮堂食消费日均值同比增长33.4%。苏宁全国门店客流同比提升超200%，以旧换新订单同比增长132%。</p></body></html>
