<body><h1>青岛纳客842.61万人次同比增15.91% 游客消费金额99.13亿元，同比增长13.02%</h1>
<p>来源：青岛日报（山东省人民政府网转载）2024-10-08</p>
<p>全市接待游客842.61万人次，同比增长15.91%；游客消费金额99.13亿元，同比增长13.02%。国庆假期监测A级景区84家，累计接待游客632.83万人次，同比增长16.17%；营业收入1.42亿元，同比增长13.57%。</p>
<p>崂山风景区国庆假期共接待游客35万人次，同比增长14.6%。青岛海上旅游联合运营体总航次5200次，载客18万人次、增长266%，船票收入1050万元、增长165%。</p>
</body></html>
