<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4O97Ah4wkQn</textarea><textarea class="article-author"> </textarea><textarea class="article-host">tech.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">美团旅行发布《2025年暑期文旅消费观察》，南京、成都、西安入选暑期热门旅游城市Top10</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">”从单一产品到一站式体验，美团旅行联动“吃住行游购娱”的多品类多场景优势构建旅游消费增长新引擎，为游客带来更多品质化、个性化、多元化的深度旅游体验</textarea><textarea class="article-catnode">/e3pmh164r/e3pmh16qj</textarea><textarea class="article-content"><article><section data-type="rtext"><p>作为全年出游高峰，2025年暑期旅游正式收官。美团旅行发布的《2025年暑期文旅消费观察》显示，今年暑期旅游市场热度持续，各类细分需求场景迸发，深度游、品质游需求旺盛。</p><p>“跟着赛事/展演去旅游”掀起热潮，“苏超”赛事助推南京进入暑期十大热门旅游城市榜首。暑期旅游出行呈现“中长线+周边游”双线并行特征。美团旅行数据显示，暑期300公里以上中长线游需求增速超15%，“周边游”“一日游”搜索量均环比上涨超70%。旅游度假品质化、个性化趋势凸显，一站式产品受热捧。“小团游”从小众迈向主流，“住宿+餐饮”“住宿+体验”等跨界间夜需求激增，住宿业供需匹配迎来新思路。</p><p><em data-scene="strong">十大热门城市热点频出，赛事展演有效吸引游客“多住一晚”</em></p><p>美团旅行数据显示，暑期热门旅游城市Top10分别为：南京市、成都市、西安市、北京市、上海市、重庆市、长沙市、广州市、洛阳市、昆明市。</p><p><img data-alt="美团旅行发布暑期十大热门旅游城市" src="//img.huanqiucdn.cn/dp/api/files/imageDir/d0f87855db5d7c5b1289ef2396625705.png?imageView2/2/w/750" /></p><p>今年夏天，“苏超”火爆出圈，全民观赛热情被彻底点燃，足球等各类赛事运动迎来高光时刻，“跟着赛事/展演去旅游”掀起热潮。赛事、展演活动呈现明显带动和辐射作用，促进当地“吃住行游购娱”等全场景消费快速增长。</p><p>南京成为“赛事+旅游”的典型标杆，“苏超”赛事助推其登顶暑期十大热门旅游城市。美团旅行数据显示，“苏超”第九轮比赛，8月17日南京主场比赛期间，当地整体文旅消费环比前一周上涨超10%，五星级酒店订单人次环比增长17%，带动城市餐饮、休闲玩乐消费纷纷上涨。</p><p>受益于第12届世界运动会，成都暑期文旅消费同样火热。美团旅行数据显示，世运会期间，8月7日-8月17日成都机票订单额环比增长26%，景区门票订单量环比增长42%，五星级酒店预订人次环比增长37%。</p><p>演唱会、艺术节等展演活动亦频频激发消费者的出游热情，成为促进当地商业消费的重要场景。8月20日-21日、8月23日-24日，时代少年团在上海体育场连开四场演唱会，吸引20余万人观演。</p><p>美团旅行数据显示，演唱会期间，上海文旅消费同比增长31%，上海酒店订单量同比增长45%，“飞洲国际广场”搜索量同比上涨超300%，带动周边美食相关搜索量同样大幅增长，商业体与演艺活动的消费联动效应凸显。</p><p>美团旅行联动时代少年团，推出“美团旅行送你去看时团演唱会”活动，在演唱会出游场景中，为年轻用户提供包括机票、酒店、景点游玩等一站式出游优惠供给。</p><p><em data-scene="strong">旅游度假品质化、个性化趋势凸显，一站式产品受热捧</em></p><p>从暑期整体交通出行趋势来看，旅游出行呈现“中长线+周边游”双线并行特征。美团旅行数据显示，暑期300公里以上中长线游需求增速超15%，跟团游产品中新疆、青甘线路占比超22%，8-10天行程最受欢迎，西部省份成为避暑“黑马”。与此同时，暑期“周边游”“一日游”相关业务搜索量环比增长40%以上，“家门口住酒店”趋势显现，带动本地及周边高星酒店与民宿需求增长。</p><p>体验经济时代下，旅游度假消费品质化趋势明显，“小团游”从小众迈向主流。美团旅行数据显示，暑期跟团游订单中，精品小团订单占比达40%，同比增加90%，云南昆明-大理-丽江、新疆北疆、川西、西藏林芝及青甘等线路成为热门之选。用户偏好从“泛观光”转向“精体验”，暑期美团旅行跟团游订单中，包含深度讲解或手作的一日游产品订单占比过半，深度体验型线路产品热度高企。</p><p>为满足消费者对于品质出行的需求，提升游客体验，美团旅行推出“美团好品”服务保障计划。入选该计划的小团游产品，在高性价比的前提下，支持“放心退”和“遇坑赔”，即所有商品在出行前1天18点前均可免费退改，专属客服保障30秒内极速响应用户问询；行程中如遇强制消费或是强制购物，无需等待商家确认，美团旅行会启动信任赔付，为消费者兜底，全程护航旅游体验。</p><p>品质化之外，个性化需求持续释放。据美团旅行数据，暑期住宿行业呈现“遛娃”与“遛宠”双线并行的个性化特征，暑期预订人群中，亲子家庭客群占比超四成，消费力强劲，有20%的亲子家庭消费者青睐五星酒店。此外，“宠物友好”酒店及民宿搜索量同比分别上涨18%和94%。</p><p>同时，越来越多的游客希望在平台上一站式获得“吃住行游购娱”的便捷服务。数据观察显示，美团上的“住宿+餐饮”“住宿+体验”等跨界间夜需求激增，住宿业供需匹配迎来新思路。</p><p>腾冲温泉智选假日酒店总经理钟聿洪表示：“腾冲的火山、咖啡、温泉，以及铜瓢牛肉、牛扒烀套饭、火烧肉裹卷粉等地道美食，大城市游客没见过，这些特色颇受成都、重庆、北京、深圳等地游客喜爱。我们酒店也在美团旅行推出‘住宿+露天温泉+咖啡’打包套餐，‘住宿+’带动腾冲温泉智选假日酒店暑期间夜量同比增长超500%。”</p><p>从单一产品到一站式体验，美团旅行联动“吃住行游购娱”的多品类多场景优势构建旅游消费增长新引擎，为游客带来更多品质化、个性化、多元化的深度旅游体验。此前，美团旅行携手三亚市旅游发展局结合第26届海南国际旅游岛欢乐节，以“王牌海岛季·爱上三亚”为营销主题推出一系列促销活动，累计带动三亚经济圈订单量同比增加35.7%，间接拉动本地消费订单同比增长27.6%。</p><p>美团文旅研究院相关负责人表示，未来，游客的细分需求将持续涌现，一站式、多场景的深度旅游体验正逐步成为游客的核心需要，旅游平台与相关企业要通过丰富产品供给、提升服务品质，满足游客在各类需求场景下的多元化选择，推动整体市场的持续增长和创新发展。</p></section></article></textarea><textarea class="article-time">1756705217606</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：李文瑶</textarea><textarea class="article-source-name"><a href="https://baijiahao.baidu.com/s?id=1842036883254798606
