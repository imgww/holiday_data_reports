<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4L6YA7JdZBn</textarea><textarea class="article-author"> </textarea><textarea class="article-host">go.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">春节将迎今年首个出游高峰</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">携程与国际旅游平台猫途鹰于1月中旬联合长治、运城、盐城、福州、漳州、南昌、景德镇、庐山、长沙、张家界十城共同承办“中国年味之旅”全球达人游中国系列活动，吸引了来</textarea><textarea class="article-catnode">/e3pmh1tuv/e3pmh1ufv/e3pmh1v35</textarea><textarea class="article-content"><article><section data-type="rtext"><p>本报记者 赵 珊《人民日报海外版》（2025年01月17日&nbsp;第&nbsp;12&nbsp;版）</p><p><img data-alt="新春佳节临近，海南省海口市博爱路年货一条街张灯结彩，吸引了众多市民游客。张 茂摄（人民图片）" src="//img.huanqiucdn.cn/dp/api/files/imageDir/831273427488a252faee5d748fc1f815.jpg?imageView2/2/w/750" /></p><p><img data-alt="游客在从山西开往内蒙古的集大原旅游专列上。王 正摄（人民视觉）" src="//img.huanqiucdn.cn/dp/api/files/imageDir/339993109cf6d7d7b9584dc3426df0c9.jpg?imageView2/2/w/750" /></p><p><img data-alt="在浙江省金华市郑店村婺剧非遗主题馆，村剧团老师给游客指导婺剧基本动作。杨梅清摄（人民图片）" src="//img.huanqiucdn.cn/dp/api/files/imageDir/84080cce2305b3b4f0b9596b2fd5c9f9.jpg?imageView2/2/w/750" /></p><p>春节是中国人阖家团圆的传统佳节，也是休闲旅游的重要节点。人们走亲访友的同时也希望游览大美河山、体验民俗风情。</p><p>春节临近，旅游市场越来越火热。在除夕正式纳入法定假日以及春节申遗成功的双重利好下，人们出游热情空前高涨。文化和旅游部于1月7日至3月1日开展“欢欢喜喜过大年”2025年春节主题文化和旅游活动。记者从多家旅行社和在线旅游机构了解到，相较于去年春节，今年国内游、出入境游全面开花，均呈现快速增长势头，中国游客在国内或海外喜迎蛇年春节，外国游客来中国体验传统佳节。</p><p><em data-scene="strong">阖家团圆国内游</em></p><p>中国旅行社协会联合途牛旅游网近日发布的《2025春节旅游消费趋势报告》显示，春节是阖家团圆的重要节日，在出游用户中，家庭客群占比超八成，家庭游成为春节旅游市场的主流。传统文化游、冰雪游、避寒游等是热门出游主题。北京、广州、上海、三亚、重庆、杭州、成都、西安、南京、哈尔滨等传统热门目的地继续领跑。</p><p>举家出游让人们更加注重品质，近两周，飞猪平台上高星级酒店预订量同比增长超40%。自驾是家庭游最青睐的出行方式。马蜂窝大数据显示，各地“春节自驾”平均热度涨幅超过100%。南方自驾线路热度高于北方，美食与年味儿兼备的福建东南沿海自驾和广东潮汕自驾搜索热度涨幅均超过150%，以休闲度假为主题的云南自驾和海南环岛自驾也颇受关注。</p><p>作为春节申遗成功的首个假期，具有特色年味儿的目的地成为很多游客的首选。北京庙会、潮汕英歌舞、广东醒狮、闽南游神、西北社火等独具地方特色的年俗活动以及簪花、扎染、剪纸、宣纸、漆扇等非遗手工技艺体验吸引了众多游客的兴趣。</p><p>被誉为“中国春节文化之乡”的四川阆中古城在马蜂窝平台的搜索热度环比增长162%，当地将开展春节文化系列活动，用非遗展览、民俗表演、特色美食向全球游客发出“寻春节之源，到阆中过年”的邀请。</p><p>向南避寒看海、向北赏雪追光也是人们春节出游的选择。携程数据显示，哈尔滨旅游热度依旧，旅游预订同比增长42%。昆明、福州、厦门等北方游客喜欢的避寒游城市，旅游预订同比分别增长118%、182%和96%。此外，今年正值太阳活动周期的巅峰，以往难以目睹极光的地方也有观赏机会，不少年轻人选择在国内观看极光，漠河、阿勒泰、禾木、锡林浩特等地的旅游订单增长分别为17%、67%、62%、197%。</p><p><em data-scene="strong">文旅活动年味足</em></p><p>文化和旅游部开展的“欢欢喜喜过大年”2025年春节主题文化和旅游活动丰富多彩，其中，“旅游迎春 休闲过年”板块将开展新春旅游休闲宣传推广、研学旅游主题推广、全国非遗特色旅游线路发布推广、欢乐冰雪旅游季，丰富春节假期旅游产品供给，传承弘扬春节文化、促进消费拉动经济，让“旅游迎春 休闲过年”成为节日新风尚、春节新年俗，使春节旅游市场更为红火，大众旅游消费更为旺盛。</p><p>文化和旅游部资源开发司向广大游客重点推介富有春节民俗特色高品质的A级旅游景区、旅游度假区、旅游休闲街区、乡村旅游村镇、红色旅游经典景区、智慧旅游场景等各类旅游产品。各地文旅部门也将推出各具特色的旅游产品，组织各类景区配套开展旅游休闲活动和民俗文化活动，推出旅游新场景新体验。</p><p>“旅游迎春·休闲过年”——2025新春旅游推广活动启动仪式将在河北省正定古城举行。河北开展“2025冬游河北过大年”系列活动，推出“冰雪过大年”“温泉过大年”“古城过大年”“景区过大年”“非遗过大年”“戏曲过大年”“休闲街区过大年”“美食过大年”等十大场景系列活动，满足广大游客多样化消费需求。</p><p>山西省将推出民俗社火、冰雪度假、古建研学、温泉康养、冬景摄影等5个主题260余项冬季旅游活动及优惠措施；黑龙江省将开展6个“一百”活动，即“百场”活动迎新春、“百条”路线赏冰雪、“百名”达人进景区、“百条”视频品年味儿、“百架”航班拆盲盒、“百万”优惠游龙江等活动。安徽省的A级景区、旅游度假区和休闲街区将策划组织活动137个，涵盖非遗展演、民俗体验、夜游巡游、特色展陈、年货市集等丰富内容。福建省以“来福建 享暖冬 烟火最暖凡人心”为主题，推出温泉康养、观鸟赏花、古城漫步、赏景品茶、海岛漫游等十大旅游精品线路。新疆将举办各类旅文体活动727场，推出春节冬游新疆玩法7种，冬季精品旅游产品72项，“冰雪之美·尽在新疆”冬游新疆精品线路30条，各地州也将举办冰雪文化旅游节、冬捕、暖冬阳光烧烤季等活动。</p><p>文化和旅游部与商务部等相关部门联合开展2025年“游购乡村”消费迎春活动，组织引导文化、旅游、商业、农业领域优质资源互通互联、开展合作，以游促购，游购结合，以“赏乡村美景、品乡村文化、购乡村好物”为主要内容，弘扬年节文化、丰富假期生活、带动农文旅消费。</p><p><em data-scene="strong">多样选择出境游</em></p><p>2025年春节8天假期带火了出境游，除了中国香港、中国澳门、韩国、日本、越南、新加坡等短途目的地预订火热外，英国、西班牙、意大利、法国、冰岛、澳大利亚、新西兰、埃及等长线游目的地也颇受青睐，订单量大幅增长。飞猪数据显示，出境游相关酒店、机票等预订量均已大幅超过2024年同期。2025年春节假期出游性价比较高，截至目前，机票、酒店等均价较2024年有所下降。</p><p>途牛旅游网统计显示，2025年春节，港澳游迎来爆发式增长，相关团队定制游、跟团游及自由行产品预订尤为火爆，特别是港澳连线跟团游产品以及粤港澳连线跟团游产品最受欢迎。</p><p>众信旅游相关负责人介绍，2025年春节出境游团队量较2024年同期增加30%，出游人数增长46%。日本北海道、北欧、俄罗斯摩尔曼斯克、“南美+南极”成为2025春节旅游市场热点。</p><p>2024年以来，中国游客出境游消费需求多样化趋势愈加显著。新西兰、澳大利亚的反季游，冰岛、挪威等北欧国家的极光游以及阿根廷、巴西等“南美五国+极地邮轮”旅游产品备受游客青睐，热门团期早已售罄。</p><p>越来越多的年轻游客不但希望走得更远、还想玩得更深入，用新玩法迎接新春。在新西兰南岛饱览亿万年冰川、乘船观看峡湾；住进乌鲁鲁沙漠风帆酒店，探索澳大利亚心脏；在格鲁吉亚的古多里滑雪，享受大高加索山脉的粉雪天堂。</p><p>随着全球邮轮旅游市场进一步复苏，境内外多个港口始发的邮轮航线供给增加，春节期间邮轮预订订单同比增长超3倍，游客人数同比增长1倍多，游客可选择从中国香港、上海、广州、新加坡等多个港口出发的邮轮产品。</p><p><em data-scene="strong">外国人过中国年</em></p><p>记者在采访中了解到，将有更多外国游客在春节期间来华感受传统佳节的魅力。入境游的高速增长是2025年春节旅游市场的一大亮点，体验非遗文化的“年味游”备受期待。携程数据显示，春节期间入境游订单同比增长203%，主要客源地国家为韩国、马来西亚、新加坡、日本、美国、澳大利亚、泰国、英国、俄罗斯、越南等。外国游客热衷的国内目的地是上海、深圳、广州、北京、哈尔滨、成都、厦门、珠海、重庆、杭州。</p><p>随着越来越多外国游客来到中国，“中国游”版本也不断升级，外国游客不仅逛传统旅游景点，还去农村赶大集、到城市逛菜市场……在街头巷尾感受中国的烟火气。来华体验中国年在海外社交平台上已然成风，2024年底实施对韩国免签政策更是吸引了大批韩国游客前往哈尔滨、成都、上海等热门旅游城市。在海外社交媒体平台上，与外滩、大熊猫、冰雕等的打卡美照和旅游视频博客正在年轻人中快速传播。据携程统计，春节期间，韩国入境游订单量同比增长452%。</p><p>携程与国际旅游平台猫途鹰于1月中旬联合长治、运城、盐城、福州、漳州、南昌、景德镇、庐山、长沙、张家界十城共同承办“中国年味之旅”全球达人游中国系列活动，吸引了来自五大洲30个国家和地区的40位海外达人前往深度采风，并举办全球旅行者沙龙，通过他们的镜头和文字在海外社交媒体上讲好中国故事，传播春节非遗文化。</p></section></article></textarea><textarea class="article-time">1737073247598</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：邢爽</textarea><textarea class="article-source-name"><a href="http://paper.people.com.cn/rmrbhwb/pc/content/202501/17/content_30052403.html" >人民日报海外版</a></textarea><textarea class="article-ext-xtime">1737073247598</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover">//img.huanqiucdn.cn/dp/api/files/imageDir/831273427488a252faee5d748fc1f815.jpg</textarea><textarea class="article-keyboarder">{"email":"xingshuang@huanqiu.com","name":"邢爽"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><scri
