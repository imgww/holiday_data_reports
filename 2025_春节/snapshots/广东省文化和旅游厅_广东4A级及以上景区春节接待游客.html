<link rel="apple-touch-icon-precomposed" href="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg">
<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4LMau6DzxjH</textarea><textarea class="article-author"> </textarea><textarea class="article-host">china.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">出游热、消费旺、年味浓！“数”看春节假期亮点、爆款、顶流</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">2月5日是春节假期后的第一个工作日。许多人已经从“过年模式”切换到“工作状态”。这个假期过得怎么样？哪些旅游消费成为爆款？这个春节的年味又有啥不一样？</textarea><textarea class="article-catnode">/e3pmh1nnq/e7tl4e309</textarea><textarea class="article-content"><article><section data-type="rtext"><p><em data-scene="strong">央视网消息：</em> 2月5日是春节假期后的第一个工作日。许多人已经从“过年模式”切换到“工作状态”。这个假期过得怎么样？哪些旅游消费成为爆款？这个春节的年味又有啥不一样？ </p><p><em data-scene="strong">银联网联共处理支付交易超220亿笔</em>  </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/5e892718b59052e50c373f101e8e1577.png?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/71112c437320c83b10fe9293ba602ba6.png?imageView2/2/w/750" /></p><p>中国人民银行的数据显示，2025年春节假期前7天，银联、网联共处理支付交易220.78亿笔、金额8.52万亿元，较2024年春节假期前7天分别增长25.70%、17.08%。其中，银联、网联处理境外来华人员支付交易笔数和金额分别增长127.30%和93.54%。 </p><p><em data-scene="strong">出行人群规模较去年同期增长8%</em>  </p><p>通信大数据平台的数据显示，刚刚过去的春节假期，出行人群规模较2024年同期增长8%。这个春节大家的出游热门地都是哪里？ </p><p><em data-scene="strong">“非遗”带动春节年味游</em>  </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/d5b5a2ac5edbc91bdaca8ff8ec5abb4c.png?imageView2/2/w/750" /></p><p>作为“申遗成功”后的首个春节，“非遗”成了2025年春节年味游的关键词。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/76b6a3ed5f31a1751aaaf63abba2b1b2.png?imageView2/2/w/750" /></p><p>中国移动梧桐大数据显示，春节假期年味游人群较2024年同期增长12%。最受欢迎的年味游目的地是北京、广东、安徽、福建和陕西。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/365e583ceb7d99a47ad53c360ce7096f.png?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/2e51f15a58ea6b2db023cec5bb782837.png?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/153356603e9d99403cdb9a6b98d972c2.png?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/b2154e0ed73f9f8d5735d49a8ae353a4.png?imageView2/2/w/750" /></p><p>其中，北京庙会、潮汕英歌舞、安徽鱼灯、闽南游神、西北社火等非遗民俗文化活动成为热门选项。 </p><p><em data-scene="strong">各大雪场年味浓 冰雪游规模增长11%</em>  </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/aaca368c5c1e1135b528de2f166b1627.png?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/350693507e916d45e7b865b4a5f8b0f5.png?imageView2/2/w/750" /></p><p>2025年春节，冰雪游再度成为焦点。哈尔滨仍是假期冰雪游的热门目的地，游客规模较去年同期增长6%。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/97be69db94653dd4e3e34b8ad4b76f11.png?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/867d000748a167b7cc30087e76f8c2fe.png?imageView2/2/w/750" /></p><p>大数据平台还发现，外国人也加入了冰雪旅游大军。假期期间，到访哈尔滨的外国游客人数较2024年同期增长42%。与此同时，南方滑雪场游客量也较2024年同期增长10%。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/753b9285da9d470284881c68124a4186.png?imageView2/2/w/750" /></p><p>从全国热门滑雪场客流量来看，滑雪热度最高的地区集中在黑龙江、吉林、河北、新疆和北京。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/02a35c97c7835ebcf8f93b960dae7ad1.png?imageView2/2/w/750" /></p><p>中国移动信息技术中心大数据产研副总经理王学建介绍，冰雪旅游热度持续攀升，游客规模较去年同期增长11%。全国各大滑雪场热度火爆，游客数量相比平日增幅超46%。 </p><p><em data-scene="strong">过境免签新政推动外国游客来华“找年味”</em>  </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/c7eb58136d53e71ea9540e3a20892087.png?imageView2/2/w/750" /></p><p>在“240小时过境免签”新政策推动下，2025年春节假期，全国入境游客规模较2024年同期增长10%。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/11596fddb1cfd31dbbdd4a784357f1fb.png?imageView2/2/w/750" /></p><p>增幅较大的游客来源国家是韩国、印度尼西亚和法国，增幅分别为79%、46%和39%。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/3838d6b92786befa0af8f151cc3a4ba8.png?imageView2/2/w/750" /></p><p>从境外游客到访的国内目的地来看，东南亚游客倾向于选择上海、成都、重庆、舟山、广州等南方城市；欧美游客则更青睐北京、上海、广州、深圳等一线城市。 </p><p><em data-scene="strong">广东接待游客8011.8万人次</em>  </p><p>据广东省文化和旅游厅初步测算，春节假期8天，广东全省累计接待游客8011.8万人次。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/7abd282db4b10c1685a1b5f0ffff1610.png?imageView2/2/w/750" /></p><p>其中，广东省4A级及以上景区接待游客2558.3万人次，纳入监测的80个重点公共文化机构接待152.9万人次。 </p><p><em data-scene="strong">湖南累计接待游客5395.51万人次</em>  </p><p>春节假期8天，湖南省累计接待游客5395.51万人次。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/8d98fff2c87ba8174fb8bba2fcb1cd03.png?imageView2/2/w/750" /></p><p>南岳衡山、韶山、凤凰古城、岳麓山-橘子洲、武陵源-天门山是春节假期湖南接待游客量较多的景区。 </p><p><em data-scene="strong">四川攀枝花游客增幅明显</em>  </p><p>春节假期，四川全省景区游客接待人数持续保持增长。其中，攀枝花市游客增幅较为明显。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/6bf1b9aa22b4bb28986f7ec090e1e64e.png?imageView2/2/w/750" /></p><p>成都宽窄巷子、西昌建昌古城、南充阆中古城接待游客人数持续位居全省前列。 </p><p><em data-scene="strong">江苏共接待游客6120.92万人次</em>  </p><p>春节假期8天，江苏共接待游客6120.92万人次。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/df14a64acb8e192bcad7174732c28410.png?imageView2/2/w/750" /></p><p>无锡是总台春晚4个分会场之一，主舞台所在地清名桥古运河景区成为这个假期的“顶流”，春节假期接待游客超155万人次。数据显示，春节期间无锡搜索热度最高同比增长185%，游客接待量同比涨幅超过三成。 </p><p><em data-scene="strong">内蒙古接待游客突破3000万人次</em>  </p><p>春节假期8天，内蒙古累计接待国内外游客突破3000万人次。 </p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/97012614f3bf744328f6df9431298c02.png?imageView2/2/w/750" /></p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/55231ee1f36ed29b7bfa56a03ca9ab27.png?imageView2/2/w/750" /></p><p>内蒙古开展了各类文旅活动417项，包括新年灯会、大众冰雪系列赛事、越野穿越、雪原骑马等，为游客提供了多样化的旅游选择。</p></section></article></textarea><textarea class="article-time">1738743652415</textarea><textarea class="article-copyright"></textarea><textarea class="article-editor-name">责编：王亚天</textarea><textarea class="article-source-name"><a href="https://news.cctv.com/2025/02/05/ARTIwxC3SOjrO8ZDzLX9L4le250205.shtml" >央视网</a></textarea><textarea class="article-ext-xtime">1738743652415</textarea><textarea class="article-ext-CommentStatus">1</textarea><textarea class="article-ext-serious">1</textarea><textarea class="article-ext-relation">[]</textarea><textarea class="article-cover">//img.huanqiucdn.cn/dp/api/files/imageDir/d5b5a2ac5edbc91bdaca8ff8ec5abb4c.png</textarea><textarea class="article-keyboarder">{"email":"wangyatian@huanqiu.com","name":"王亚天"}</textarea></article><div id="csr_m_article_ad" style="display:none;">43147</div><script>function decodeEntities(encodedString) {
