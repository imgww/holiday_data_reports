<body>
<script type="text/javascript">
	$(document).ready(function () {
		//url参数 判断来源
		var getUrl = "http://m2.people.cn/n/" + getUrlParam('s') + '.json';
		/*   console.log(getUrl)*/
		//分析url参数中的from  getUrlParam('from source');
		if (getUrlParam('from') == null) {
			var fromOrigin = "default";
		} else {
			var fromOrigin = getUrlParam('from');
		}
		var tmpHtml1 = $('#baseTemplate').html()
		var tmpDiv = document.createElement('div')
		tmpDiv.style.display = 'none'
		tmpDiv.id = 'tmp-div'
		$('body').prepend(tmpDiv)
		$('#tmp-div').html(tmpHtml1)
		$.ajax({
			url: getUrl,
			success: function (result) {
				var doJson = eval("(" + result + ")");
				//console.log(doJson);
				//处理content的内容
				var content = doJson.content;
				var content = content.replace(/\s*/g, ""); //去掉空格
				var imgReg = /<img.*?(?:>|\/>)/gi;
				var srcReg = /src=[\'\"]?([^\'\"]*)[\'\"]?/i;
				var arr = content.match(imgReg);
				if (arr != null) {
					for (var i = 0; i < arr.length; i++) {
						var src = arr[i].match(srcReg);
						var src_clean = src[1].replace('@1l', ''); //去掉图片中的@1l
						//把arr[i] 替换成  <div class="sgui-img-box" data-src="src[1]"></div>  需要提取出img的src标签 src[1]
						var rs = arr[i].replace(arr[i], '<div class="sgui-img-box" data-src=' + src_clean + '></div>');
					}
				}
				var data = {
					title: doJson.title,
					content: doJson.content.replaceAll("@1l", ""), //处理content中的img标签的@符号
					url: doJson.url,
					author: doJson.author,
					fromOrigin: fromOrigin,
					origin_node_id: doJson.origin_node_id,
					origin: doJson.origin_name === '' ? '人民网' : doJson.origin_name,
					display_time:doJson.display_time,
					editor: doJson.editor,
				};

				//console.log(data);
				$(document).attr("title");
				$(document).attr("title", data.title);
				var tmpHtml = template("baseTemplate", data);
				$('body').prepend(tmpHtml)
				$('#tmp-div').remove()

				//meta标签的处理
				$('meta[name="partner"]').attr("content", 'm2_' + data.fromOrigin);
				$('meta[name="editor"]').attr("content", data.editor);
			},
			error: function (arg1) {
				$('html').html('404')
				console.log(arg1.status)
			}
		})
	});
	function getUrlParam (name) {
		var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)"); //构造一个含有目标参数的正则表达式对象
		var r = window.location.search.substr(1).match(reg);  //匹配目标参数
		if (r != null) return unescape(r[2]);
		return null; //返回参数值
	}
        function getLocalTime(nS) {
              return new Date(parseInt(nS) * 1000).toLocaleString().replace(/:\d{1,2}$/,' ');
         }


</script>
<script type="text/template" id="baseTemplate">
	<article>
		<h1>{{title}}</h1>
		<h2>
		<span class="time">{{display_time}}</span>
		<span class="origin">{{origin}}</span>
		<span class="font">小字</span>
		</h2>
		<div class="slash"></div>
		<div class="content">
			{{#content}}
		</div>
	</article>
</script>
  <div style="display: none">
    <div id="show"></div>
  </div>
