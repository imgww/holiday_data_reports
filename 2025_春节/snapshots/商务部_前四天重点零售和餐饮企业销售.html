<link href=""="//rs2.huanqiucdn.cn/huanqiu/image/www/common/favicon1.ico" rel="shortcut icon" /></head><body><img src="//rs2.huanqiucdn.cn/huanqiu/image/m/share.jpg" style="display:none;" id="slogo"><div id="config_page" style="display:none;">/csr-component-m/config/article/index.js</div><div id="global_constant" style="display:none"><span class="global_host">lx.huanqiu.com</span><span class="global_path"></span></div><div class="data-container" style="overflow:hidden; visibility:hidden;height:0;"><article><textarea class="article-aid">4LNNQzU5Z9P</textarea><textarea class="article-author"> </textarea><textarea class="article-host">finance.huanqiu.com</textarea><textarea class="article-lang">zh-Hans</textarea><textarea class="article-addltype">article</textarea><textarea class="article-title">2025年春节餐饮市场火爆，销售额创出新高</textarea><textarea class="article-subtitle"></textarea><textarea class="article-ext-topic"></textarea><textarea class="article-summary">新茶饮市场同样表现强劲，霸王茶姬全国门店春节期间销量涨幅超300%，部分门店增幅甚至超过500%</textarea><textarea class="article-catnode">/e3pmh1hmp/e3pn47igg</textarea><textarea class="article-content"><article><section data-type="rtext"><p>【环球网消费综合报道】2025年春节期间，我国餐饮市场成绩斐然，各地餐饮业销售额和客流量实现双增长，多项数据刷新历史纪录。据商务部数据，春节假期前四天，全国重点零售与餐饮企业销售额同比增长5.4%，重点监测的餐饮企业营业额增长5.1%。</p><p>在北京、上海、广州等一线城市，知名餐饮品牌如西贝餐饮、海底捞、费大厨辣椒炒肉等纷纷迎来客流高峰。特别是海底捞，春节期间通过增加营业门店数，7天内接待顾客超过1000万人次，成为行业关注的焦点。烤鱼品牌烤匠在北京市场表现抢眼，而特色火锅品牌呷哺呷哺及湊湊的客流量同比增长约20%。北京胡大饭馆春节假期收入同比增长13%，客流增长22%。</p><p>新茶饮市场同样表现强劲，霸王茶姬全国门店春节期间销量涨幅超300%，部分门店增幅甚至超过500%。茶百道数据显示，除夕至大年初七，期间销售火爆，多家门店销量增幅超400%，景区门店销量增幅达3500%。</p><p>分析指出，春节餐饮市场的火爆主要得益于旅游客和返乡客的叠加效应。非遗游、入境游、返乡游等多元化客流为餐饮市场注入新动能。特色餐饮和小吃品类在旅游热门城市迎来爆发，下沉市场也因返乡人数增加而焕发活力。</p><p><img data-alt="" src="//img.huanqiucdn.cn/dp/api/files/imageDir/6d44fb1ef94068aa3e766e129e1428a7u5.jpg?imageView2/2/w/750" /></p><p>在激烈的市场竞争中，餐饮企业各显神通，通过拼食材、拼文化来吸引消费者。费大厨推出的有机食材系列，辣椒炒肉点单率超过90%。呷哺呷哺、霸王茶姬等品牌以“非遗”为营销主题，举办各类文化活动，提升消费者体验。</p><p>业内人士表示，春节餐饮市场的繁荣为行业带来信心，真材实料、真心实意地经营理念将继续推动餐饮业的繁荣发展。（文馨）</p></section></article></texta
